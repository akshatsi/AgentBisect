[project]
name = "agentbisect"
version = "0.1.0"
description = "git bisect over a coding agent's individual actions: find the step that broke your code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
agentbisect = "agentbisect.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentbisect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: runs real subprocesses at scale"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tasks/fixture_repo", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # formatter owns line length; typer needs Option() defaults
