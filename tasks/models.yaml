# Model aliases for AgentBisect. Swapping a model never touches code: edit this file.
#
# Every API id and price is UNKNOWN until harness-builder runs the probe once Alan AI access
# arrives (see docs/ARCHITECTURE.md, "Model usage"). llm.py REFUSES to call any model whose
# api_id or prices are null, so the spend cap can never be bypassed by a guess.
#
# Fields:
#   api_id           model name sent in the request body
#   role             what AgentBisect uses it for
#   price_in_per_1m  USD per 1M input tokens
#   price_out_per_1m USD per 1M output tokens
#   tool_calls       true if native tool calls work, false if the JSON fallback is needed,
#                    null if not probed yet
models:
  # Smoke tests, harness development, explainer
  nano:
    display_name: Nemotron 3 Nano
    role: smoke
    api_id: null  # TODO: fill from probe
