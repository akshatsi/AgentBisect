id: t05
title: Replace order status strings with an enum
repo: tasks/fixture_repo
max_steps: 25
prompt: |
  The project is a small Python library in the working directory: shop/ (errors, money, catalog, inventory, pricing, orders, report) with tests in tests/. Run the tests with `python -m pytest`. Money is always integer cents. Do not add third-party dependencies.

  Order status is a plain string ("placed", "cancelled") compared in several modules. Replace it with an `OrderStatus` enum defined in shop/orders.py. Use `enum.StrEnum` so `order.status == "placed"` still works, `OrderBook.orders("placed")` still works, and the text and CSV reports print the same values as before. Use the enum inside the library code instead of string literals. Add a test for the enum. All existing tests must keep passing.
