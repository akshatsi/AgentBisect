id: t06
title: Index catalog categories
repo: tasks/fixture_repo
max_steps: 25
prompt: |
  The project is a small Python library in the working directory: shop/ (errors, money, catalog, inventory, pricing, orders, report) with tests in tests/. Run the tests with `python -m pytest`. Money is always integer cents. Do not add third-party dependencies.

  `Catalog.by_category` and `Catalog.categories` scan and sort every product on each call. Make them fast for large catalogs by keeping a category index that `add` and `remove` maintain. Results must keep the same order and content as today, including after products are added or removed. Add a test that exercises add, remove, and re-add. All existing tests must keep passing.
