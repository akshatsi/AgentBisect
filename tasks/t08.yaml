id: t08
title: Thousands separators in money formatting
repo: tasks/fixture_repo
max_steps: 20
prompt: |
  The project is a small Python library in the working directory: shop/ (errors, money, catalog, inventory, pricing, orders, report) with tests in tests/. Run the tests with `python -m pytest`. Money is always integer cents. Do not add third-party dependencies.

  `money.format_cents` should group thousands with commas for display: 123456 becomes "$1,234.56". Update the library so this works for the text reports. The CSV export is read by spreadsheets and other tools and must keep plain decimals with no separators. Add tests, and keep all existing tests passing.
