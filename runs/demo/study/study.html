<head>

<title>AgentBisect study</title>
<style>
:root {
  /* one theme: near-black with a gray tint, white text; red and green mean fail and pass */
  --bg: #131416; --bg2: #191a1d; --panel: #1c1d20; --panel2: #232427; --ink: #f4f4f5;
  --muted: #a1a4aa; --line: #2d2f33; --line2: #3d4045;
  --accent: #f4f4f5; --accent-bg: #2b2d31; --accent-ink: #131416;
  --red: #ff5c63; --red-bg: #3b1a1d; --red-solid: #e5484d;
  --amber: #e3a948; --amber-bg: #33290f;
  --blue: #7db4ff; --blue-bg: #17283f;
  --green: #3fd27f; --green-bg: #123122;
  --code-bg: #101113; --code-ink: #dcdee2;
  --add-bg: #123122; --add-ink: #8fe6b3; --add-gut: #17432c;
  --del-bg: #3b1a1d; --del-ink: #ffb0b4; --del-gut: #54252a;
  --hunk-bg: #17283f; --hunk-ink: #8fbaff;
  --tk-k: #c9a0f0; --tk-s: #a5d6a7; --tk-c: #858a94; --tk-n: #e3a948;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.28);
  --hero: var(--panel);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
#app { min-height: 100vh; }
.boot { padding: 40px 20px; color: var(--muted); text-align: center; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 14px; height: 54px; }

.topbar .grow { flex: 1; min-width: 0; }
.crumb { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 6px 12px;
  font-size: 13.5px; font-weight: 600; line-height: 1.2; min-height: 34px; color: var(--ink);
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover:not(:disabled) { background: var(--panel2); border-color: var(--muted); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.icon { padding: 6px 9px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--bg2); border-color: var(--line); }
.btn svg { flex: none; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.card.pad { padding: 18px 20px; }
.section { margin: 18px 0; }
.section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

/* chips and pills */
.chips { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); max-width: 100%; }
.chip b { color: var(--ink); font-weight: 600; }
.chip code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.pill { display: inline-block; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); line-height: 20px; white-space: nowrap; }
.pill.pass { color: var(--green); background: var(--green-bg); border-color: transparent; }
.pill.fail { color: var(--red); background: var(--red-bg); border-color: transparent; }
.pill.error, .pill.cens { color: var(--amber); background: var(--amber-bg); border-color: transparent; }

.tag.obs { background: var(--blue); color: var(--panel); }

.tag.sab { border: 1px dashed var(--amber); color: var(--amber); }

/* code */
pre.code {

  border-radius: 10px; font-size: 12.5px; line-height: 1.5; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
}
pre.code.nowrap { white-space: pre; overflow-wrap: normal; }
.capbox { position: relative; }
.capbox.capped pre.code { max-height: 15em; overflow: hidden; }
.capbox.capped::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: 33px; height: 2px; background: var(--line2); pointer-events: none; }
.capbox .more { display: block; width: 100%; margin-top: 4px; }
.cap { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 6px; }

/* diff */
.diff { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); font-size: 12.5px; }
.diff .dfile { border-top: 1px solid var(--line); }
.diff .dfile:first-child { border-top: 0; }
.diff .dhead { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--panel2); font-weight: 600; position: sticky; top: 0; }
.diff .dhead .path { overflow-wrap: anywhere; flex: 1; font-size: 12.5px; }
.diff .dhead .st { font-size: 12px; white-space: nowrap; }
.diff .plus { color: var(--green); } .diff .minus { color: var(--red); }
.diff .dscroll { overflow-x: auto; }
.diff .dl { display: grid; grid-template-columns: 3.4em 3.4em 1.4em minmax(0, 1fr); line-height: 1.5; min-width: max-content; width: 100%; }
.diff .dl > span { padding: 0 6px; }
.diff .dl .ln { text-align: right; color: var(--muted); opacity: .85; user-select: none; background: var(--panel2); font-size: 11.5px; }
.diff .dl .sg { text-align: center; user-select: none; }
.diff .dl code { white-space: pre; padding-right: 14px; }
.diff .dl.add { background: var(--add-bg); color: var(--add-ink); } .diff .dl.add .ln { background: var(--add-gut); color: var(--add-ink); }
.diff .dl.del { background: var(--del-bg); color: var(--del-ink); } .diff .dl.del .ln { background: var(--del-gut); color: var(--del-ink); }
.diff .dl.hunk { background: var(--hunk-bg); color: var(--hunk-ink); } .diff .dl.hunk .ln { background: var(--hunk-bg); }
.diff .dl.note { color: var(--muted); font-style: italic; }
.diff .tk-k { color: var(--tk-k); font-weight: 600; } .diff .tk-s { color: var(--tk-s); } .diff .tk-c { color: var(--tk-c); font-style: italic; } .diff .tk-n { color: var(--tk-n); }
.diff .dl.add .tk-k, .diff .dl.del .tk-k { filter: saturate(1.2); }

.tablewrap { overflow-x: auto; border-radius: 10px; }

tbody tr:hover { background: var(--panel2); }
tr:last-child td { border-bottom: 0; }

.footer { color: var(--muted); font-size: 12.5px; padding: 26px 0 40px; text-align: center; }
details > summary { cursor: pointer; }
.notice { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); background: var(--panel2); font-size: 14px; }
.notice.warn { background: var(--amber-bg); border-color: transparent; color: var(--ink); }
.notice.ok { background: var(--green-bg); border-color: transparent; }

.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
.how > div { background: color-mix(in srgb, var(--panel) 75%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.how b { display: flex; align-items: center; gap: 8px; font-size: 14.5px; margin-bottom: 3px; }
.how .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 800; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.runcard { display: flex; flex-direction: column; gap: 8px; padding: 20px; text-decoration: none; color: var(--ink); position: relative; transition: transform .15s, border-color .15s, box-shadow .15s; }
.runcard:hover { transform: translateY(-3px); border-color: var(--accent); }
.runcard .rtag { align-self: flex-start; font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--red-bg); color: var(--red); }
.runcard .rtag.ok { background: var(--green-bg); color: var(--green); }
.runcard .rtag.warn { background: var(--amber-bg); color: var(--amber); }
.runcard h3 { font-size: 18px; letter-spacing: -.01em; overflow-wrap: anywhere; }

.runcard .rmeta { font-size: 12.5px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.runcard .open { font-weight: 700; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.metric { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }

.metric .v { font-size: 34px; font-weight: 780; letter-spacing: -.025em; line-height: 1.15; overflow-wrap: anywhere; }
.metric .v.na { font-size: 19px; color: var(--amber); letter-spacing: 0; padding: 7px 0; }
.metric .ciline { font-size: 13px; color: var(--ink); }
.metric .m { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.metric .sim { align-self: flex-start; font-size: 11.5px; padding: 1px 8px; margin-top: 4px; border: 1px dashed var(--amber); color: var(--amber); border-radius: 6px; font-weight: 600; }
.cirail { position: relative; height: 8px; border-radius: 5px; background: var(--line); margin-top: 8px; }
.cirail i { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 5px; min-width: 3px; }
.cirail b { position: absolute; top: -3px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); border: 2.5px solid var(--panel); }
.ciaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }

.panel { padding: 18px 20px; }
.panel.sep { border-style: dashed; border-color: var(--line2); }
.panel h2.t { font-size: 17px; font-weight: 750; text-transform: none; letter-spacing: -.01em; color: var(--ink); margin-bottom: 4px; }
.panel .lede { font-size: 14px; color: var(--muted); margin-bottom: 14px; max-width: 60em; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.keys span { display: inline-flex; align-items: center; gap: 7px; }
.keys i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.keys .k-err { background: var(--red-solid); } .keys .k-obs { background: var(--blue); }

.lagchart { position: relative; padding-top: 22px; }

.llabel { padding-right: 14px; font-size: 13.5px; display: grid; gap: 1px; min-width: 0; }
.llabel a, .llabel .nm { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; line-height: 1.3; font-weight: 600; color: var(--ink); text-decoration: none; }

th button { all: unset; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; border-radius: 4px; }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
th .arrow { font-size: 10px; opacity: .35; } th[aria-sort="ascending"] .arrow, th[aria-sort="descending"] .arrow { opacity: 1; color: var(--accent); }

<main style="max-width: 980px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif;">
  <h1>AgentBisect study</h1>
  <p>git bisect for coding agents. This page is interactive and needs JavaScript; the numbers are below as plain text.</p>
  <p>2026-10-26 18:48 UTC &middot; METHODS §8 variant B: DeepSeek V4.1 Flash only in Alan Code, the 10 t-tasks plus 6 repeats (16 task runs) and 3 sabotage runs; sabotage runs count for accuracy, not for lag.</p>

  <h2>Scope</h2>
  <p>Every claim here is about flash in Alan Code, on this fixture library and these tasks. It says nothing about other models, other agents, or other code.</p>
  <p>6 runs counted,
     1 ended broken, 1 excluded.</p>

  <h2>Demo runs</h2>
  <ul>
    <li><a href="../humanize-planted-break/report.html">humanize-planted-break</a>: Step 8 (shell: python -m pytest -q --doctest-modules src/humanize/lists.py) broke 3 tests: test_naturalsize[test_args1-1.0 kB], test_naturalsize[test_args2-1.0 kB], test_naturalsize[test_args56-1.0K]. This was the agent&#39;s last step, so it had no chance to see the failure. The run ended with the tests broken.</li>
    <li><a href="../caught-and-fixed/report.html">caught-and-fixed</a>: Step 9 (edit tests/test_report.py) broke test_cancel_restores_stock. The agent saw it at step 13 and fixed it before the end. 4 steps and 112k tokens went into broken code first.</li>
    <li><a href="../humanize-ordinal-fix/report.html">humanize-ordinal-fix</a>: No test that passed at the start fails at the end. The agent worked for 70 steps and the run ended green.</li>
  </ul>

  <h2>Headline numbers</h2>
  <ul>
    <li><strong>Runs</strong>: 6,
      n = 6, count. 4 task runs, 2 sabotage runs (1 directories excluded)</li>
    <li><strong>Broken-run share</strong>: 0% (95% CI [0%, 49%]),
      n = 4, Wilson 95%. 0/4: runs whose final state fails the oracle / task runs (sabotage runs excluded)</li>
    <li><strong>Bisectable share of broken runs</strong>: not estimable,
      n = 0, Wilson 95%. no data: broken runs with at least one culprit found / broken runs</li>
    <li><strong>Censoring rate of broken runs</strong>: not estimable,
      n = 0, Wilson 95%. no data: runs where the agent never saw the failure / bisectable broken runs</li>

<script>
/* Shared helpers and components for the report pages. Loaded after Preact, hooks and htm.
   Everything from a run reaches the DOM as a text node or an attribute value. */
(function () {
  "use strict";
  var P = preact;
  var H = preactHooks;
  var html = htm.bind(P.h);
  var AB = {
    h: P.h,
    html: html,
    render: P.render,
    Fragment: P.Fragment,
    useState: H.useState,
    useEffect: H.useEffect,
    useRef: H.useRef,
    useMemo: H.useMemo,
    useCallback: H.useCallback,
    useLayoutEffect: H.useLayoutEffect,
  };
  window.AB = AB;

  AB.readData = function () {
    return JSON.parse(document.getElementById("data").textContent);
  };
  AB.cx = function () {
    var out = [];
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) out.push(arguments[i]);
    return out.join(" ");
  };
  AB.plural = function (n, one, many) {
    return n + " " + (n === 1 ? one : many || one + "s");
  };
  AB.reducedMotion = function () {
    try {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {
      return false;
    }
  };
  AB.clamp = function (x, lo, hi) {
    return Math.max(lo, Math.min(hi, x));
  };
  AB.isTyping = function (el) {
    if (!el || !el.tagName) return false;
    var t = el.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || el.isContentEditable === true;
  };

  /* ------------------------------------------------------------------ icons */

  var PATHS = {
    read: ["M1.5 8s2.3-4.5 6.5-4.5S14.5 8 14.5 8s-2.3 4.5-6.5 4.5S1.5 8 1.5 8z", "M8 6.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z"],
    write: ["M4 1.8h5l3 3v9.4H4z", "M8 7.2v4M6 9.2h4"],
    edit: ["M2.8 13.2l.7-3.1L11 2.6l2.4 2.4-7.5 7.5z", "M9.6 4l2.4 2.4"],
    shell: ["M2.5 4.5L6 8l-3.5 3.5", "M8 12h5.5"],
    finish: ["M4 14.2V2.2", "M4 3h8.2l-1.7 2.9 1.7 2.9H4"],
    other: ["M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"],
    base: ["M3.5 3v10", "M3.5 3.5h8L9.6 6.2l1.9 2.7h-8"],
    play: ["M4.5 2.8v10.4L13 8z"],
    pause: ["M5 3v10", "M11 3v10"],
    step: ["M3.5 3v10L10 8z", "M12.5 3v10"],
    back: ["M12.5 3v10L6 8z", "M3.5 3v10"],
    reset: ["M3 8a5 5 0 1 0 1.6-3.7", "M3 2.6v3h3"],
    sun: ["M8 5.3a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4z", "M8 1.2v1.5M8 13.3v1.5M1.2 8h1.5M13.3 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"],
    moon: ["M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"],
    search: ["M7 2.8a4.2 4.2 0 1 0 0 8.4 4.2 4.2 0 0 0 0-8.4z", "M10.2 10.2l3.3 3.3"],
    chev: ["M4 6l4 4 4-4"],
    check: ["M3 8.4l3.2 3.2L13 4.8"],
    cross: ["M4 4l8 8M12 4l-8 8"],
    warn: ["M8 2.4l6 10.6H2z", "M8 6.6v3M8 11.2v.1"],
    link: ["M6.6 9.4a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-.8.8", "M9.4 6.6a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l.8-.8"],
    arrow: ["M3 8h10M9 4l4 4-4 4"],
  };
  AB.Icon = function (props) {
    var name = props.name;
    var size = props.size || 16;
    var paths = PATHS[name] || PATHS.other;
    var fill = name === "play" || name === "pause" ? "currentColor" : "none";
    return html`<svg width=${size} height=${size} viewBox="0 0 16 16" fill=${fill} stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      ${paths.map(function (d) { return html`<path d=${d} />`; })}
    </svg>`;
  };
  AB.Glyph = function (props) {
    var kind = PATHS[props.kind] ? props.kind : "other";
    return html`<${AB.Icon} name=${kind} size=${props.size || 15} />`;
  };

  AB.Logo = function () {
    return html`<svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="26" height="26" rx="8" fill="currentColor" opacity=".14" />
      <path d="M7 14h5.5M12.5 14l6-5.5M12.5 14l6 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="7" cy="14" r="2" fill="currentColor" />
      <circle cx="19.5" cy="8.5" r="2.1" fill="var(--green)" />
      <circle cx="19.5" cy="19.5" r="2.1" fill="var(--red-solid)" />
    </svg>`;
  };

  AB.TopBar = function (props) {
    return html`<header class="topbar">
      <div class="wrap">
        <span class="brand"><${AB.Logo} /> AgentBisect <small>${props.kind}</small></span>
        <span class="grow crumb">${props.crumb}</span>
        ${props.children}
      </div>
    </header>`;
  };

  /* ------------------------------------------------------------------ blocks */

  /* A monospace block. Long text starts capped and opens with a button. */
  AB.CodeBlock = function (props) {
    var text = props.text || "";
    var lines = text.split("\n").length;
    var long = lines > 14 || text.length > 1500;
    var s = AB.useState(false);
    var open = s[0];
    var capped = long && !open;
    return html`<div class=${AB.cx("capbox", capped && "capped")}>
      <pre class=${AB.cx("code", props.nowrap && "nowrap")} tabindex="0" aria-label=${props.label}>${text}</pre>
      ${long
        ? html`<button type="button" class="btn ghost more small" aria-expanded=${open} onClick=${function () { s[1](!open); }}>
            ${open ? "Show less" : "Show all " + lines + " lines"}
          </button>`
        : null}
    </div>`;
  };

  /* ------------------------------------------------------------------ diff */

  var KEYWORDS = {
    py: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield self",
    js: "async await break case catch class const continue default delete do else export extends false finally for from function if import in instanceof let new null of return static super switch this throw true try typeof undefined var void while yield",
  };
  var KWSET = {};
  Object.keys(KEYWORDS).forEach(function (k) {
    var set = {};
    KEYWORDS[k].split(" ").forEach(function (w) { set[w] = true; });
    KWSET[k] = set;
  });
  var LANG = { py: "py", pyi: "py", js: "js", mjs: "js", ts: "js", tsx: "js", jsx: "js" };
  var TOKEN_RE = /(#.*$|\/\/.*$)|("(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)|(\b\d[\d_]*(?:\.\d+)?\b)|([A-Za-z_][A-Za-z_0-9]*)/g;

  /* Split one line of code into [className, text] pieces. A very light tokenizer: comments,
     strings, numbers and keywords. Anything else stays plain. */
  AB.tokenize = function (line, lang) {
    if (!lang || line.length > 400) return [["", line]];
    var set = KWSET[lang];
    var out = [];
    var last = 0;
    var m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(line))) {
      var cls = "";
      if (m[1] !== undefined) {
        if (lang === "py" && m[1].slice(0, 2) === "//") continue;
        if (lang === "js" && m[1][0] === "#") continue;
        cls = "tk-c";
      } else if (m[2] !== undefined) cls = "tk-s";
      else if (m[3] !== undefined) cls = "tk-n";
      else if (set[m[4]]) cls = "tk-k";
      else continue;
      if (m.index > last) out.push(["", line.slice(last, m.index)]);
      out.push([cls, m[0]]);
      last = m.index + m[0].length;
    }
    if (last < line.length) out.push(["", line.slice(last)]);
    return out;
  };

  /* Parse a unified diff into files -> rows. Row: {k: add|del|ctx|hunk|note, a: old line, b: new line, t: text}. */
  AB.parseDiff = function (text) {
    var files = [];
    var f = null;
    var inHunk = false;
    var oldN = 0;
    var newN = 0;
    var lines = text.split("\n");
    if (lines.length && lines[lines.length - 1] === "") lines.pop();
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (ln.slice(0, 11) === "diff --git ") {
        var mm = /^diff --git a\/(.*) b\/(.*)$/.exec(ln);
        f = { path: mm ? mm[2] : ln.slice(11), status: "modified", rows: [], add: 0, del: 0 };
        files.push(f);
        inHunk = false;
        continue;
      }
      if (!f) {
        f = { path: "(diff)", status: "modified", rows: [], add: 0, del: 0 };
        files.push(f);
      }
      if (!inHunk) {
        if (ln.slice(0, 8) === "new file") f.status = "added";
        else if (ln.slice(0, 12) === "deleted file") f.status = "deleted";
        else if (ln.slice(0, 4) === "--- " && f.path === "(diff)") f.path = ln.slice(4).replace(/^a\//, "");
        else if (ln.slice(0, 13) === "Binary files ") f.rows.push({ k: "note", t: ln });
        else if (ln.slice(0, 2) === "@@") {
          inHunk = true;
          i--;
        }
        continue;
      }
      if (ln.slice(0, 2) === "@@") {
        var h = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(ln);
        oldN = h ? parseInt(h[1], 10) : 0;
        newN = h ? parseInt(h[2], 10) : 0;
        f.rows.push({ k: "hunk", t: ln });
        continue;
      }
      var c = ln.charAt(0);
      if (c === "+") {
        f.rows.push({ k: "add", b: newN++, t: ln.slice(1) });
        f.add++;
      } else if (c === "-") {
        f.rows.push({ k: "del", a: oldN++, t: ln.slice(1) });
        f.del++;
      } else if (c === "\\") {
        f.rows.push({ k: "note", t: ln.slice(1).trim() });
      } else {
        f.rows.push({ k: "ctx", a: oldN++, b: newN++, t: ln.slice(1) });
      }
    }
    return files;
  };

  function langOf(path) {
    var m = /\.([A-Za-z0-9]+)$/.exec(path || "");
    return m ? LANG[m[1].toLowerCase()] : null;
  }

  AB.DiffView = function (props) {
    var files = AB.useMemo(function () { return AB.parseDiff(props.text || ""); }, [props.text]);
    if (!files.length) return null;
    return html`<div class="diff" role="group" aria-label=${props.label || "Diff"}>
      ${files.map(function (f) {
        var lang = langOf(f.path);
        return html`<section class="dfile">
          <div class="dhead">
            <span class="path mono">${f.path}</span>
            ${f.status !== "modified" ? html`<span class="tag prb">${f.status}</span>` : null}
            <span class="st mono"><span class="plus">+${f.add}</span> <span class="minus">−${f.del}</span></span>
          </div>
          <div class="dscroll">
            ${f.rows.map(function (r) {
              if (r.k === "hunk" || r.k === "note")
                return html`<div class=${"dl " + r.k}><span class="ln"></span><span class="ln"></span><span class="sg"></span><code>${r.t}</code></div>`;
              var sign = r.k === "add" ? "+" : r.k === "del" ? "−" : "";
              var toks = AB.tokenize(r.t, lang);
              return html`<div class=${"dl " + r.k}>
                <span class="ln">${r.a === undefined ? "" : r.a}</span>
                <span class="ln">${r.b === undefined ? "" : r.b}</span>
                <span class="sg">${sign}</span>
                <code>${toks.map(function (t) { return t[0] ? html`<span class=${t[0]}>${t[1]}</span>` : t[1]; })}</code>
              </div>`;
            })}
          </div>
        </section>`;
      })}
    </div>`;
  };
})();

</script>
<script>
/* The study page: landing header, demo run cards, headline numbers, lag chart, runs table. */
(function () {
  "use strict";
  var A = AB;
  var html = A.html;
  var useState = A.useState;
  var useMemo = A.useMemo;
  var cx = A.cx;
  var D = A.readData();

  function pctOf(v, max) {
    return (max > 0 ? A.clamp(v / max, 0, 1) * 100 : 0) + "%";
  }

  /* ---------------------------------------------------------------- landing */

  function Landing() {
    var c = D.counts;
    return html`<section class="landing">
      <div class="wrap">
        <p class="kicker">Study results${D.created ? " · " + D.created : ""}</p>
        <h1><${A.Logo} /> AgentBisect</h1>
        <p class="pitch">git bisect for coding agents. It finds the exact step where an agent broke your code, and how long the agent kept working before it noticed.</p>
        <p class="pitch2">It saves the repo after every agent action, then binary-searches those saves with your failing test. The verdict comes from running tests. No language model decides pass or fail.</p>
        <div class="chips">
          <span class="chip"><b>${c.runs}</b> ${c.runs === 1 ? "run" : "runs"} counted</span>
          <span class="chip"><b>${c.broken_runs}</b> ended broken</span>
          ${D.excluded.length ? html`<span class="chip"><b>${D.excluded.length}</b> excluded</span>` : null}
          ${c.models.length ? html`<span class="chip">model <b>${c.models.join(", ")}</b></span>` : null}
          ${D.design ? html`<span class="chip" title=${D.design}><code>${D.design.length > 70 ? D.design.slice(0, 69) + "…" : D.design}</code></span>` : null}
        </div>
        <div class="how">
          <div><b><span class="num">1</span> Record</b>Snapshot the repo after every step the agent takes.</div>
          <div><b><span class="num">2</span> Bisect</b>Binary-search the snapshots with your failing test.</div>
          <div><b><span class="num">3</span> Measure</b>Count the steps and tokens between the break and the agent noticing.</div>
        </div>
      </div>
    </section>`;
  }

  function RunCards() {
    if (!D.featured.length) return null;
    return html`<div class="section">
      <h2>Start here: real runs</h2>
      <div class="cards">
        ${D.featured.map(function (f) {
          var tone = f.kind === "bad" ? "" : f.kind === "ok" ? "ok" : "warn";
          return html`<a class="card runcard" key=${f.run_id} href=${f.href} aria-label=${"Open the report for " + f.run_id}>
            <span class=${cx("rtag", tone)}>${f.tag}</span>
            <h3>${f.run_id}</h3>
            <p class="v1" title=${f.sentences[0] || null}>${f.sentences[0] || "No verdict."}</p>
            ${f.sentences.length > 1 ? html`<p class="v2">${f.sentences.slice(1).join(" ")}</p>` : null}
            <span class="rmeta">${f.n_steps} steps · ${f.tokens} tokens${f.model ? " · " + f.model : ""}</span>
            <span class="open">Open the report <${A.Icon} name="arrow" size=${15} /></span>
          </a>`;
        })}
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------- numbers */

  function trimNum(x) {
    return String(Math.round(x * 10) / 10);
  }

  function Metric(props) {
    var m = props.m;
    var hasCi = m.raw != null && m.low != null && m.high != null;
    var top = m.percent ? 1 : Math.max(m.high || 0, m.raw || 0) * 1.1 || 1;
    return html`<div class="card metric">
      <div class="k">${m.name}</div>
      <div class=${cx("v", !m.estimable && "na")}>${m.value}</div>
      ${m.interval ? html`<div class="ciline mono">${m.interval}</div>` : null}
      ${hasCi
        ? html`<div aria-hidden="true">
            <div class="cirail"><i style=${{ left: pctOf(m.low, top), width: "calc(" + pctOf(m.high, top) + " - " + pctOf(m.low, top) + ")" }}></i><b style=${{ left: pctOf(m.raw, top) }}></b></div>
            <div class="ciaxis"><span>0</span><span>${m.percent ? "100%" : trimNum(top)}</span></div>
          </div>`
        : null}
      <div class="m">n = ${m.n} · ${m.method}</div>
      ${m.note ? html`<div class="m">${m.note}</div>` : null}
      ${m.simulation ? html`<span class="sim">simulation, not real agent runs</span>` : null}
    </div>`;
  }

  function Numbers() {
    return html`<div class="section">
      <h2>Headline numbers</h2>
      ${D.metrics.length
        ? html`<div class="metrics">${D.metrics.map(function (m) { return html`<${Metric} m=${m} key=${m.name} />`; })}</div>`
        : html`<p class="muted">No metrics were computed.</p>`}
    </div>`;
  }

  /* ---------------------------------------------------------------- chart */

  function LagRow(props) {
    var b = props.b;
    var ch = props.chart;
    var x = function (v) { return pctOf(v, ch.axis_max); };
    var label = b.href
      ? html`<a href=${b.href}>${b.label}</a>`
      : html`<span class="nm">${b.label}</span>`;
    return html`<div class="lrow" tabindex="0" role="img" aria-label=${b.title}>
      <div class="llabel">${label}<span class="ltext">${b.text}</span></div>
      <div class="ltrack">
        ${ch.ticks.map(function (t) { return html`<i class="gl" style=${{ left: x(t) }}></i>`; })}
        <i class="runend" style=${{ left: x(b.end) }} title="end of the run"></i>
        ${b.kind === "censored"
          ? html`<i class="open" style=${{ left: x(b.t_err), width: "calc(" + x(b.end) + " - " + x(b.t_err) + ")" }}></i>
              <i class="arrowhead" style=${{ left: x(b.end) }}></i>
              <b class="dot err" style=${{ left: x(b.t_err) }}></b>`
          : b.kind === "instant"
            ? html`<b class="dot obs" style=${{ left: "calc(" + x(b.t_err) + " + 6px)" }}></b><b class="dot err" style=${{ left: x(b.t_err) }}></b>`
            : html`<i class="span" style=${{ left: x(b.t_err), width: "calc(" + x(b.t_obs) + " - " + x(b.t_err) + ")" }}></i>
                <b class="dot err" style=${{ left: x(b.t_err) }}></b><b class="dot obs" style=${{ left: x(b.t_obs) }}></b>`}
      </div>
      <div class="tip" role="tooltip">${b.title}</div>
    </div>`;
  }

  function Chart(props) {
    var ch = props.chart;
    return html`<div class="lagchart chartwrap">
      <div class="laxis"><span></span><div class="ticks">${ch.ticks.map(function (t) {
        return html`<span style=${{ left: pctOf(t, ch.axis_max) }}>${t}</span>`;
      })}</div></div>
      ${ch.bars.map(function (b, i) { return html`<${LagRow} b=${b} chart=${ch} key=${i} />`; })}
    </div>`;
  }

  function LagPanel() {
    return html`<div class="section"><div class="card panel">
      <h2 class="t">Detection lag in broken runs</h2>
      <p class="lede">One row per run that ended broken. The axis counts steps. Hover or focus a row for the details.</p>
      ${D.lag_chart
        ? html`<div class="keys">
              <span><i class="k-err"></i>step that broke the code</span>
              <span><i class="k-obs"></i>step where the agent first saw the failure</span>
              <span><i class="k-span"></i>steps spent on broken code</span>
              <span><i class="k-open"></i>open end: the agent never saw it (censored)</span>
            </div>
            <${Chart} chart=${D.lag_chart} />
            <p class="note small muted" style=${{ marginTop: "10px" }}>The grey tick marks where each run ended.</p>`
        : html`<p class="muted">No run ended broken with a decisive step, so there is nothing to draw.</p>`}
    </div></div>`;
  }

  function EpisodePanel() {
    return html`<div class="section"><div class="card panel sep">
      <h2 class="t">Repaired breaks (a separate series)</h2>
      <p class="lede">The agent broke a test that passed at the start, saw the failure, and fixed it. We find these only when the agent saw them, so none is censored. They say nothing about breaks the agent never saw. Never pool this series with the broken runs above.</p>
      ${D.episode_chart
        ? html`<div class="keys">
              <span><i class="k-err"></i>step that broke the test</span>
              <span><i class="k-obs"></i>step where the agent saw the failure</span>
              <span><i class="k-span"></i>steps before it saw it</span>
            </div>
            <${Chart} chart=${D.episode_chart} />`
        : null}
      ${D.episodes.length
        ? html`<div class="tablewrap" style=${{ marginTop: "14px" }}><table>
            <thead><tr><th>Run</th><th>Test</th><th>Seen at</th><th>t_err</th><th>Lag</th><th>Tokens wasted</th><th>Note</th></tr></thead>
            <tbody>${D.episodes.map(function (e, i) {
              return html`<tr key=${i}>
                <td class="mono">${e.href ? html`<a href=${e.href}>${e.run_id}</a>` : e.run_id}</td>
                <td class="mono">${e.check}</td><td class="num">${e.seen_at}</td><td class="num">${e.t_err}</td>
                <td class="num">${e.lag}</td><td class="num">${e.wasted}</td><td>${e.reason || ""}</td></tr>`;
            })}</tbody></table></div>`
        : html`<p class="muted">No repaired breaks found.</p>`}
    </div></div>`;
  }

  /* ---------------------------------------------------------------- runs table */

  var COLS = [
    { k: "task", label: "Task", get: function (r) { return r.task; } },
    { k: "run", label: "Run", get: function (r) { return r.run_id; } },
    { k: "check", label: "Test", get: function (r) { return r.check; } },
    { k: "steps", label: "Steps", get: function (r) { return r.steps; }, num: true },
    { k: "broken", label: "Broken?", get: function (r) { return r.broken; } },
    { k: "t_err", label: "t_err", get: function (r) { return r.t_err_n; }, num: true },
    { k: "t_obs", label: "t_obs", get: function (r) { return r.t_obs_n; }, num: true },
    { k: "lag", label: "Lag", get: function (r) { return r.lag_n; }, num: true },
    { k: "share", label: "Wasted share", get: function (r) { return r.share_n; }, num: true },
    { k: "sabotage", label: "Sabotage correct", get: function (r) { return r.sabotage; } },
  ];

  function cellOf(r, col) {
    switch (col.k) {
      case "run":
        return r.href ? html`<a href=${r.href}>${r.run_id}</a>` : r.run_id;
      case "broken":
        return html`<span class=${"pill " + r.broken_class}>${r.broken}</span>`;
      case "t_err":
        return r.t_err;
      case "t_obs":
        return r.t_obs;
      case "lag":
        return r.censored ? html`<span class="pill cens">${r.lag}</span>` : r.lag;
      case "share":
        return r.share;
      case "sabotage":
        return r.sabotage_class ? html`<span class=${"pill " + r.sabotage_class}>${r.sabotage}</span>` : r.sabotage;
      case "task":
        return r.task;
      case "check":
        return r.check;
      default:
        return r.steps;
    }
  }

  function RunsTable() {
    var sortS = useState({ k: null, dir: 1 });
    var qS = useState("");
    var sort = sortS[0];
    var q = qS[0].trim().toLowerCase();
    var rows = useMemo(
      function () {
        var out = D.runs
          .map(function (r, i) { return { r: r, i: i }; })
          .filter(function (x) {
            if (!q) return true;
            var r = x.r;
            return [r.task, r.run_id, r.check, r.steps, r.broken, r.t_err, r.t_obs, r.lag, r.share, r.sabotage]
              .join(" ")
              .toLowerCase()
              .indexOf(q) !== -1;
          });
        if (sort.k) {
          var col = COLS.filter(function (c) { return c.k === sort.k; })[0];
          out.sort(function (a, b) {
            var x = col.get(a.r);
            var y = col.get(b.r);
            if (x == null && y == null) return a.i - b.i;
            if (x == null) return 1;
            if (y == null) return -1;
            var d = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "en", { numeric: true });
            return d ? d * sort.dir : a.i - b.i;
          });
        }
        return out;
      },
      [sort.k, sort.dir, q]
    );
    function toggle(k) {
      sortS[1](sort.k === k ? { k: k, dir: -sort.dir } : { k: k, dir: 1 });
    }
    return html`<div class="section"><div class="card panel">
      <h2 class="t">Runs</h2>
      <p class="lede">Every counted run. Click a column to sort. Click a run id to open its report.</p>
      ${D.runs.length
        ? html`<div class="tools">
              <input type="search" placeholder="Filter runs" aria-label="Filter runs" value=${qS[0]} onInput=${function (e) { qS[1](e.target.value); }} />
              <span class="small muted" role="status">${rows.length} of ${D.runs.length} rows</span>
            </div>
            <div class="tablewrap"><table>
              <thead><tr>${COLS.map(function (c) {
                var on = sort.k === c.k;
                return html`<th key=${c.k} aria-sort=${on ? (sort.dir === 1 ? "ascending" : "descending") : "none"}>
                  <button type="button" onClick=${function () { toggle(c.k); }}>${c.label}<span class="arrow" aria-hidden="true">${on ? (sort.dir === 1 ? "▲" : "▼") : "⇅"}</span></button></th>`;
              })}</tr></thead>
              <tbody>${rows.map(function (x) {
                return html`<tr key=${x.i}>${COLS.map(function (c) {
                  return html`<td class=${cx(c.num && "num", c.k === "run" && "mono nw", c.k === "check" && "mono clip")} title=${c.k === "check" ? x.r.check : null}>${cellOf(x.r, c)}</td>`;
                })}</tr>`;
              })}</tbody>
            </table></div>`
        : html`<p class="muted">No runs.</p>`}
    </div></div>`;
  }

  function Excluded() {
    return html`<div class="section"><div class="card panel">
      <h2 class="t">Excluded runs</h2>
      ${D.excluded.length
        ? html`<div class="tablewrap"><table><thead><tr><th>Run</th><th>Reason</th></tr></thead>
            <tbody>${D.excluded.map(function (x, i) { return html`<tr key=${i}><td class="mono">${x[0]}</td><td>${x[1]}</td></tr>`; })}</tbody></table></div>`
        : html`<p class="muted">No run was excluded.</p>`}
    </div></div>`;
  }

  function Claims() {
    var li = function (name) {
      return function (s) { return html`<li><${A.Icon} name=${name} size=${16} /><span>${s}</span></li>`; };
    };
    return html`<div class="section"><div class="card panel claimbox">
      <h2 class="t">What this can and cannot claim</h2>
      <div class="claims" style=${{ marginTop: "12px" }}>
        <div class="yes"><h3>It can claim</h3><ul>${D.can.map(li("check"))}</ul></div>
        <div class="no"><h3>It cannot claim</h3><ul>${D.cannot.map(li("cross"))}</ul></div>
      </div>
    </div></div>`;
  }

  function App() {
    return html`<div>
      <${A.TopBar} kind="study" crumb="" />
      <${Landing} />
      <main class="wrap page">
        <${RunCards} />
        <${Numbers} />
        <${LagPanel} />
        <${EpisodePanel} />
        <${RunsTable} />
        <${Excluded} />
        <${Claims} />
        <p class="footer">Each verdict comes from running a test on each snapshot. No language model decides pass or fail.<br />Made by AgentBisect.</p>
      </main>
    </div>`;
  }

  var root = document.getElementById("app");
  root.textContent = "";
  A.render(html`<${App} />`, root);
})();

</script>
</body>
</html>
