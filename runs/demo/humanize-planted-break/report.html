<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AgentBisect report humanize-planted-break</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("agentbisect-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #f3f5f9; --bg2: #eaedf4; --panel: #ffffff; --panel2: #f7f8fb; --ink: #131824;
  --muted: #566176; --line: #e0e4ec; --line2: #c9d0dc;
  --accent: #5640e0; --accent-bg: #edebfd; --accent-ink: #ffffff;
  --red: #c8283a; --red-bg: #fdecee; --red-solid: #d1323f;
  --amber: #a85f00; --amber-bg: #fff3d9;
  --blue: #1558c8; --blue-bg: #e6effd;
  --green: #17803f; --green-bg: #e4f5ea;
  --code-bg: #f3f5f9; --code-ink: #1d2433;
  --add-bg: #e7f6ec; --add-ink: #0f5a2c; --add-gut: #cdeed9;
  --del-bg: #fdecee; --del-ink: #8a1e2b; --del-gut: #f9d1d6;
  --hunk-bg: #e6effd; --hunk-ink: #1558c8;
  --tk-k: #8a2be2; --tk-s: #0b7a3b; --tk-c: #7b8497; --tk-n: #a85f00;
  --shadow: 0 1px 2px rgba(20,28,45,.06), 0 8px 24px rgba(20,28,45,.06);
  --hero: linear-gradient(135deg, #ecebff 0%, #ffffff 55%);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e14; --bg2: #10141c; --panel: #151a23; --panel2: #1b212c; --ink: #e8ebf2;
--muted: #9aa5b8; --line: #262d3a; --line2: #364052;
--accent: #8f84ff; --accent-bg: #211f46; --accent-ink: #0b0e14;
--red: #ff6b78; --red-bg: #34171c; --red-solid: #e5484d;
--amber: #f2b45a; --amber-bg: #33270f;
--blue: #6aa8ff; --blue-bg: #13253f;
--green: #55d089; --green-bg: #11301f;
--code-bg: #0d1118; --code-ink: #d7deea;
--add-bg: #11301f; --add-ink: #9be6b6; --add-gut: #17432a;
--del-bg: #34171c; --del-ink: #ffadb4; --del-gut: #4b2027;
--hunk-bg: #13253f; --hunk-ink: #8fbaff;
--tk-k: #c792ea; --tk-s: #a5d6a7; --tk-c: #7d8aa0; --tk-n: #f2b45a;
--shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
--hero: linear-gradient(135deg, #1b1740 0%, #151a23 55%);
color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e14; --bg2: #10141c; --panel: #151a23; --panel2: #1b212c; --ink: #e8ebf2;
--muted: #9aa5b8; --line: #262d3a; --line2: #364052;
--accent: #8f84ff; --accent-bg: #211f46; --accent-ink: #0b0e14;
--red: #ff6b78; --red-bg: #34171c; --red-solid: #e5484d;
--amber: #f2b45a; --amber-bg: #33270f;
--blue: #6aa8ff; --blue-bg: #13253f;
--green: #55d089; --green-bg: #11301f;
--code-bg: #0d1118; --code-ink: #d7deea;
--add-bg: #11301f; --add-ink: #9be6b6; --add-gut: #17432a;
--del-bg: #34171c; --del-ink: #ffadb4; --del-gut: #4b2027;
--hunk-bg: #13253f; --hunk-ink: #8fbaff;
--tk-k: #c792ea; --tk-s: #a5d6a7; --tk-c: #7d8aa0; --tk-n: #f2b45a;
--shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
--hero: linear-gradient(135deg, #1b1740 0%, #151a23 55%);
color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
#app { min-height: 100vh; }
.boot { padding: 40px 20px; color: var(--muted); text-align: center; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 14px; height: 54px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.01em; font-size: 16px; text-decoration: none; color: var(--ink); }
.brand svg { color: var(--accent); }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; letter-spacing: 0; }
.topbar .grow { flex: 1; min-width: 0; }
.crumb { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 6px 12px;
  font-size: 13.5px; font-weight: 600; line-height: 1.2; min-height: 34px; color: var(--ink);
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover:not(:disabled) { background: var(--panel2); border-color: var(--muted); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.icon { padding: 6px 9px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--bg2); border-color: var(--line); }
.btn svg { flex: none; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.card.pad { padding: 18px 20px; }
.section { margin: 18px 0; }
.section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

/* chips and pills */
.chips { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); max-width: 100%; }
.chip b { color: var(--ink); font-weight: 600; }
.chip code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.pill { display: inline-block; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); line-height: 20px; white-space: nowrap; }
.pill.pass { color: var(--green); background: var(--green-bg); border-color: transparent; }
.pill.fail { color: var(--red); background: var(--red-bg); border-color: transparent; }
.pill.error, .pill.cens { color: var(--amber); background: var(--amber-bg); border-color: transparent; }
.tag { display: inline-block; font-size: 11px; line-height: 17px; padding: 0 7px; border-radius: 5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.tag.dec { background: var(--red-solid); color: #fff; }
.tag.obs { background: var(--blue); color: var(--panel); }
.tag.brk { background: var(--amber-bg); color: var(--amber); }
.tag.prb { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
.tag.sab { border: 1px dashed var(--amber); color: var(--amber); }
.tag.fix { background: var(--green-bg); color: var(--green); }

/* code */
pre.code {
  margin: 0; padding: 12px 14px; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line);
  border-radius: 10px; font-size: 12.5px; line-height: 1.5; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
}
pre.code.nowrap { white-space: pre; overflow-wrap: normal; }
.capbox { position: relative; }
.capbox.capped pre.code { max-height: 15em; overflow: hidden; }
.capbox.capped::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: 33px; height: 40px; border-radius: 0 0 10px 10px; background: linear-gradient(transparent, var(--code-bg)); pointer-events: none; }
.capbox .more { display: block; width: 100%; margin-top: 4px; }
.cap { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 6px; }

/* diff */
.diff { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); font-size: 12.5px; }
.diff .dfile { border-top: 1px solid var(--line); }
.diff .dfile:first-child { border-top: 0; }
.diff .dhead { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--panel2); font-weight: 600; position: sticky; top: 0; }
.diff .dhead .path { overflow-wrap: anywhere; flex: 1; font-size: 12.5px; }
.diff .dhead .st { font-size: 12px; white-space: nowrap; }
.diff .plus { color: var(--green); } .diff .minus { color: var(--red); }
.diff .dscroll { overflow-x: auto; }
.diff .dl { display: grid; grid-template-columns: 3.4em 3.4em 1.4em minmax(0, 1fr); line-height: 1.5; min-width: max-content; width: 100%; }
.diff .dl > span { padding: 0 6px; }
.diff .dl .ln { text-align: right; color: var(--muted); opacity: .85; user-select: none; background: var(--panel2); font-size: 11.5px; }
.diff .dl .sg { text-align: center; user-select: none; }
.diff .dl code { white-space: pre; padding-right: 14px; }
.diff .dl.add { background: var(--add-bg); color: var(--add-ink); } .diff .dl.add .ln { background: var(--add-gut); color: var(--add-ink); }
.diff .dl.del { background: var(--del-bg); color: var(--del-ink); } .diff .dl.del .ln { background: var(--del-gut); color: var(--del-ink); }
.diff .dl.hunk { background: var(--hunk-bg); color: var(--hunk-ink); } .diff .dl.hunk .ln { background: var(--hunk-bg); }
.diff .dl.note { color: var(--muted); font-style: italic; }
.diff .tk-k { color: var(--tk-k); font-weight: 600; } .diff .tk-s { color: var(--tk-s); } .diff .tk-c { color: var(--tk-c); font-style: italic; } .diff .tk-n { color: var(--tk-n); }
.diff .dl.add .tk-k, .diff .dl.del .tk-k { filter: saturate(1.2); }

/* tables */
.tablewrap { overflow-x: auto; border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; background: var(--panel2); }
tbody tr:hover { background: var(--panel2); }
tr:last-child td { border-bottom: 0; }

.footer { color: var(--muted); font-size: 12.5px; padding: 26px 0 40px; text-align: center; }
details > summary { cursor: pointer; }
.notice { border-radius: 12px; padding: 12px 16px; border: 1px solid var(--line); background: var(--panel2); font-size: 14px; }
.notice.warn { background: var(--amber-bg); border-color: transparent; color: var(--ink); }
.notice.ok { background: var(--green-bg); border-color: transparent; }
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .topbar .crumb { display: none; }
  .btn { min-height: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---- run page ---- */
main.page { padding-bottom: 20px; }
.runmeta { margin: 22px 0 6px; }
.runmeta h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 10px; margin: 8px -2px 0; scrollbar-width: thin; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 8px; max-width: 320px; padding: 8px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 11px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  color: var(--muted); transition: border-color .15s, color .15s, background .15s;
}
.tab span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab:hover { border-color: var(--muted); color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 -2px 0 var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--red-solid); }
.dot.ok { background: var(--green); } .dot.warn { background: var(--amber); }

/* hero */
.hero { background: var(--hero); padding: 24px 26px 22px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--red-solid); }
.hero.ok::before { background: var(--green); } .hero.warn::before { background: var(--amber); }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
.hero.ok .eyebrow { color: var(--green); } .hero.warn .eyebrow { color: var(--amber); }
.headline { font-size: clamp(20px, 3.2vw, 28px); font-weight: 750; letter-spacing: -.015em; line-height: 1.25; overflow-wrap: anywhere; max-width: 60em; }
.headline .stepno { display: inline-block; background: var(--red-solid); color: #fff; padding: 0 .4em; border-radius: .3em; margin-right: .1em; }
.hero.ok .headline .stepno { background: var(--green); }
.subs { margin-top: 10px; display: grid; gap: 4px; color: var(--ink); font-size: 15.5px; max-width: 60em; }
.subs p { overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 20px 0 4px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.stat .v { font-size: 25px; font-weight: 760; letter-spacing: -.02em; line-height: 1.25; }
.stat .v small { font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--amber); border-radius: 4px; }
.heroactions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.note { font-size: 13.5px; color: var(--muted); margin-top: 8px; overflow-wrap: anywhere; }
.note.alert { color: var(--amber); }
.truth { font-weight: 600; } .truth.ok { color: var(--green); } .truth.bad { color: var(--red); }

/* lag panel */
.lag { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line2); }
.lag h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; margin-bottom: 12px; }
.lagtrack { position: relative; height: 26px; border-radius: 8px; background: var(--green-bg); border: 1px solid color-mix(in srgb, var(--green) 40%, transparent); }
.lagtrack .seg { position: absolute; top: -1px; bottom: -1px; }
.lagtrack .seg.broken { background: repeating-linear-gradient(135deg, var(--amber-bg) 0 7px, color-mix(in srgb, var(--amber) 38%, var(--amber-bg)) 7px 14px); border-top: 2px solid var(--amber); border-bottom: 2px solid var(--amber); }
.lagtrack .seg.broken.open { border-right: 0; mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
.lagtrack .seg.after { background: var(--blue-bg); border: 0; border-radius: 0 7px 7px 0; opacity: .8; }
.lagtrack .mk { position: absolute; top: -7px; width: 4px; height: 38px; margin-left: -2px; border-radius: 3px; }
.lagtrack .mk.err { background: var(--red-solid); } .lagtrack .mk.obs { background: var(--blue); }
.lagtrack .arrow { position: absolute; right: -6px; top: -4px; color: var(--amber); }
.lagkey { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; font-size: 13.5px; }
.lagkey span { display: inline-flex; align-items: center; gap: 7px; }
.lagkey i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.lagtok { display: flex; align-items: flex-end; gap: 2px; height: 54px; margin-top: 16px; }
.lagtok button { flex: 1 1 0; min-width: 2px; padding: 0; border: 0; border-radius: 2px 2px 0 0; background: var(--line2); cursor: pointer; opacity: .85; }
.lagtok button:hover { opacity: 1; }
.lagtok button.pre { background: var(--line2); } .lagtok button.err { background: var(--red-solid); opacity: 1; }
.lagtok button.broken { background: var(--amber); } .lagtok button.obs { background: var(--blue); opacity: 1; }
.lagtok button.post { background: var(--line2); }
.lagcap { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* members (several tests at one step) */
.members { margin-top: 14px; }
.members select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); color: var(--ink); max-width: 100%; }
.members details { margin-top: 8px; }
.members ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; overflow-wrap: anywhere; }

/* replay */
.replay { padding: 18px 20px 20px; }
.rp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rp-head h2 { font-size: 16px; font-weight: 750; display: flex; align-items: center; gap: 8px; }
.rp-sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.badge-recon { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 6px; border: 1px dashed var(--amber); color: var(--amber); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 13px; height: 13px; border-radius: 4px; border: 1.5px solid var(--line2); display: inline-block; background: var(--panel2); }
.legend .l-good { background: var(--green-bg); border-color: var(--green); }
.legend .l-bad { background: var(--red-bg); border-color: var(--red); }
.legend .l-unk { background: repeating-linear-gradient(45deg, var(--amber-bg) 0 4px, transparent 4px 8px); border-color: var(--amber); }
.legend .l-dec { background: var(--red-solid); border-color: var(--red-solid); }
.legend .l-brk { background: var(--amber-bg); border-color: var(--amber); }
.legend .l-obs { border-color: var(--blue); box-shadow: 0 0 0 1.5px var(--blue); }
.legend .l-ro { border-style: dashed; }
.legend .l-sab { border: 1.5px dashed var(--amber); background: transparent; }
.strip { display: flex; flex-wrap: wrap; gap: 14px 6px; margin: 20px 0 8px; padding-top: 6px; }
.cell {
  width: 36px; height: 48px; padding: 0; border-radius: 10px; border: 1.5px solid var(--line2); background: var(--panel2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; cursor: pointer;
  color: var(--ink); font-size: 10.5px; font-weight: 600; line-height: 1;
  transition: background .3s, border-color .3s, transform .25s, box-shadow .25s, opacity .3s;
}
.cell .ix { font-variant-numeric: tabular-nums; opacity: .8; }
.cell.ro { border-style: dashed; color: var(--muted); background: transparent; }
.cell:hover { border-color: var(--muted); transform: translateY(-2px); }
.cell.good { background: var(--green-bg); border-color: var(--green); }
.cell.bad { background: var(--red-bg); border-color: var(--red); }
.cell.out { opacity: .42; }
.cell.outside { opacity: .3; filter: grayscale(.6); }
.cell.broken { background: var(--amber-bg); border-color: var(--amber); }
.cell.broken.ro { background: var(--amber-bg); }
.cell.observed { box-shadow: 0 0 0 2.5px var(--blue); border-color: var(--blue); }
.cell.decisive { background: var(--red-solid); border-color: var(--red-solid); color: #fff; opacity: 1; box-shadow: 0 4px 14px color-mix(in srgb, var(--red-solid) 55%, transparent); }
.cell.sabotage::before { content: ""; position: absolute; inset: -5px; border: 1.5px dashed var(--amber); border-radius: 13px; pointer-events: none; }
.cell.cur { transform: translateY(-6px) scale(1.1); box-shadow: 0 0 0 3px var(--accent), 0 8px 18px rgba(0,0,0,.2); z-index: 2; opacity: 1; }
.cell.dim { opacity: .16; }
.cell.sel::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -8px; height: 3px; border-radius: 2px; background: var(--accent); }

  var PATHS = {

    write: ["M4 1.8h5l3 3v9.4H4z", "M8 7.2v4M6 9.2h4"],
    edit: ["M2.8 13.2l.7-3.1L11 2.6l2.4 2.4-7.5 7.5z", "M9.6 4l2.4 2.4"],
    shell: ["M2.5 4.5L6 8l-3.5 3.5", "M8 12h5.5"],
    finish: ["M4 14.2V2.2", "M4 3h8.2l-1.7 2.9 1.7 2.9H4"],
    other: ["M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"],
    base: ["M3.5 3v10", "M3.5 3.5h8L9.6 6.2l1.9 2.7h-8"],
    play: ["M4.5 2.8v10.4L13 8z"],
    pause: ["M5 3v10", "M11 3v10"],
    step: ["M3.5 3v10L10 8z", "M12.5 3v10"],
    back: ["M12.5 3v10L6 8z", "M3.5 3v10"],
    reset: ["M3 8a5 5 0 1 0 1.6-3.7", "M3 2.6v3h3"],
    sun: ["M8 5.3a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4z", "M8 1.2v1.5M8 13.3v1.5M1.2 8h1.5M13.3 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"],
    moon: ["M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"],
    search: ["M7 2.8a4.2 4.2 0 1 0 0 8.4 4.2 4.2 0 0 0 0-8.4z", "M10.2 10.2l3.3 3.3"],
    chev: ["M4 6l4 4 4-4"],
    check: ["M3 8.4l3.2 3.2L13 4.8"],
    cross: ["M4 4l8 8M12 4l-8 8"],
    warn: ["M8 2.4l6 10.6H2z", "M8 6.6v3M8 11.2v.1"],
    link: ["M6.6 9.4a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-.8.8", "M9.4 6.6a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l.8-.8"],
    arrow: ["M3 8h10M9 4l4 4-4 4"],
  };
  AB.Icon = function (props) {
    var name = props.name;
    var size = props.size || 16;
    var paths = PATHS[name] || PATHS.other;
    var fill = name === "play" || name === "pause" ? "currentColor" : "none";
    return html`<svg width=${size} height=${size} viewBox="0 0 16 16" fill=${fill} stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      ${paths.map(function (d) { return html`<path d=${d} />`; })}
    </svg>`;
  };
  AB.Glyph = function (props) {
    var kind = PATHS[props.kind] ? props.kind : "other";
    return html`<${AB.Icon} name=${kind} size=${props.size || 15} />`;
  };

  AB.Logo = function () {
    return html`<svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="26" height="26" rx="8" fill="currentColor" opacity=".14" />
      <path d="M7 14h5.5M12.5 14l6-5.5M12.5 14l6 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="7" cy="14" r="2" fill="currentColor" />
      <circle cx="19.5" cy="8.5" r="2.1" fill="var(--green)" />
      <circle cx="19.5" cy="19.5" r="2.1" fill="var(--red-solid)" />
    </svg>`;
  };

  /* ------------------------------------------------------------------ theme */

  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    try {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  AB.ThemeToggle = function () {
    var s = AB.useState(currentTheme());
    var theme = s[0];
    AB.useEffect(function () {
      // follow the system setting while the person has not picked a theme
      var mq;
      try {
        mq = window.matchMedia("(prefers-color-scheme: dark)");
      } catch (e) {
        return undefined;
      }
      function onChange() {
        s[1](currentTheme());
      }
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      return function () {
        if (mq.removeEventListener) mq.removeEventListener("change", onChange);
      };
    }, []);
    function flip() {
      var next = theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try {
        localStorage.setItem("agentbisect-theme", next);
      } catch (e) {}
      s[1](next);
    }
    var label = theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
    return html`<button type="button" class="btn icon" onClick=${flip} aria-label=${label} title=${label}>
      <${AB.Icon} name=${theme === "dark" ? "sun" : "moon"} size=${17} />
      <span class="tlabel">${theme === "dark" ? "Light" : "Dark"}</span>
    </button>`;
  };

  AB.TopBar = function (props) {
    return html`<header class="topbar">
      <div class="wrap">
        <span class="brand"><${AB.Logo} /> AgentBisect <small>${props.kind}</small></span>
        <span class="grow crumb">${props.crumb}</span>
        ${props.children}
        <${AB.ThemeToggle} />
      </div>
    </header>`;
  };

  /* ------------------------------------------------------------------ blocks */

  /* A monospace block. Long text starts capped and opens with a button. */
  AB.CodeBlock = function (props) {
    var text = props.text || "";
    var lines = text.split("\n").length;
    var long = lines > 14 || text.length > 1500;
    var s = AB.useState(false);
    var open = s[0];
    var capped = long && !open;
    return html`<div class=${AB.cx("capbox", capped && "capped")}>
      <pre class=${AB.cx("code", props.nowrap && "nowrap")} tabindex="0" aria-label=${props.label}>${text}</pre>
      ${long
        ? html`<button type="button" class="btn ghost more small" aria-expanded=${open} onClick=${function () { s[1](!open); }}>
            ${open ? "Show less" : "Show all " + lines + " lines"}
          </button>`
        : null}
    </div>`;
  };

  /* ------------------------------------------------------------------ diff */

  var KEYWORDS = {
    py: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield self",
    js: "async await break case catch class const continue default delete do else export extends false finally for from function if import in instanceof let new null of return static super switch this throw true try typeof undefined var void while yield",
  };
  var KWSET = {};
  Object.keys(KEYWORDS).forEach(function (k) {
    var set = {};
    KEYWORDS[k].split(" ").forEach(function (w) { set[w] = true; });
    KWSET[k] = set;
  });
  var LANG = { py: "py", pyi: "py", js: "js", mjs: "js", ts: "js", tsx: "js", jsx: "js" };
  var TOKEN_RE = /(#.*$|\/\/.*$)|("(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)|(\b\d[\d_]*(?:\.\d+)?\b)|([A-Za-z_][A-Za-z_0-9]*)/g;

  /* Split one line of code into [className, text] pieces. A very light tokenizer: comments,
     strings, numbers and keywords. Anything else stays plain. */
  AB.tokenize = function (line, lang) {
    if (!lang || line.length > 400) return [["", line]];
    var set = KWSET[lang];
    var out = [];
    var last = 0;
    var m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(line))) {
      var cls = "";
      if (m[1] !== undefined) {
        if (lang === "py" && m[1].slice(0, 2) === "//") continue;
        if (lang === "js" && m[1][0] === "#") continue;
        cls = "tk-c";
      } else if (m[2] !== undefined) cls = "tk-s";
      else if (m[3] !== undefined) cls = "tk-n";
      else if (set[m[4]]) cls = "tk-k";
      else continue;
      if (m.index > last) out.push(["", line.slice(last, m.index)]);
      out.push([cls, m[0]]);
      last = m.index + m[0].length;
    }
    if (last < line.length) out.push(["", line.slice(last)]);
    return out;
  };

  /* Parse a unified diff into files -> rows. Row: {k: add|del|ctx|hunk|note, a: old line, b: new line, t: text}. */
  AB.parseDiff = function (text) {
    var files = [];
    var f = null;
    var inHunk = false;
    var oldN = 0;
    var newN = 0;
    var lines = text.split("\n");
    if (lines.length && lines[lines.length - 1] === "") lines.pop();
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (ln.slice(0, 11) === "diff --git ") {
        var mm = /^diff --git a\/(.*) b\/(.*)$/.exec(ln);
        f = { path: mm ? mm[2] : ln.slice(11), status: "modified", rows: [], add: 0, del: 0 };
        files.push(f);
        inHunk = false;
        continue;
      }
      if (!f) {
        f = { path: "(diff)", status: "modified", rows: [], add: 0, del: 0 };
        files.push(f);
      }
      if (!inHunk) {
        if (ln.slice(0, 8) === "new file") f.status = "added";
        else if (ln.slice(0, 12) === "deleted file") f.status = "deleted";
        else if (ln.slice(0, 4) === "--- " && f.path === "(diff)") f.path = ln.slice(4).replace(/^a\//, "");
        else if (ln.slice(0, 13) === "Binary files ") f.rows.push({ k: "note", t: ln });
        else if (ln.slice(0, 2) === "@@") {
          inHunk = true;
          i--;
        }
        continue;
      }
      if (ln.slice(0, 2) === "@@") {
        var h = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(ln);
        oldN = h ? parseInt(h[1], 10) : 0;
        newN = h ? parseInt(h[2], 10) : 0;
        f.rows.push({ k: "hunk", t: ln });
        continue;
      }
      var c = ln.charAt(0);
      if (c === "+") {
        f.rows.push({ k: "add", b: newN++, t: ln.slice(1) });
        f.add++;
      } else if (c === "-") {
        f.rows.push({ k: "del", a: oldN++, t: ln.slice(1) });
        f.del++;
      } else if (c === "\\") {
        f.rows.push({ k: "note", t: ln.slice(1).trim() });
      } else {
        f.rows.push({ k: "ctx", a: oldN++, b: newN++, t: ln.slice(1) });
      }
    }
    return files;
  };

  function langOf(path) {
    var m = /\.([A-Za-z0-9]+)$/.exec(path || "");
    return m ? LANG[m[1].toLowerCase()] : null;
  }

  AB.DiffView = function (props) {
    var files = AB.useMemo(function () { return AB.parseDiff(props.text || ""); }, [props.text]);
    if (!files.length) return null;
    return html`<div class="diff" role="group" aria-label=${props.label || "Diff"}>
      ${files.map(function (f) {
        var lang = langOf(f.path);
        return html`<section class="dfile">
          <div class="dhead">
            <span class="path mono">${f.path}</span>
            ${f.status !== "modified" ? html`<span class="tag prb">${f.status}</span>` : null}
            <span class="st mono"><span class="plus">+${f.add}</span> <span class="minus">−${f.del}</span></span>
          </div>
          <div class="dscroll">
            ${f.rows.map(function (r) {
              if (r.k === "hunk" || r.k === "note")
                return html`<div class=${"dl " + r.k}><span class="ln"></span><span class="ln"></span><span class="sg"></span><code>${r.t}</code></div>`;
              var sign = r.k === "add" ? "+" : r.k === "del" ? "−" : "";
              var toks = AB.tokenize(r.t, lang);
              return html`<div class=${"dl " + r.k}>
                <span class="ln">${r.a === undefined ? "" : r.a}</span>
                <span class="ln">${r.b === undefined ? "" : r.b}</span>
                <span class="sg">${sign}</span>
                <code>${toks.map(function (t) { return t[0] ? html`<span class=${t[0]}>${t[1]}</span>` : t[1]; })}</code>
              </div>`;
            })}
          </div>
        </section>`;
      })}
    </div>`;
  };
})();

</script>
<script>
/* The run report. Reads the JSON blob and draws: verdict, bisect replay, step explorer, details. */
(function () {
  "use strict";
  var A = AB;
  var html = A.html;
  var useState = A.useState;
  var useEffect = A.useEffect;
  var useRef = A.useRef;
  var useMemo = A.useMemo;
  var cx = A.cx;
  var D = A.readData();
  var STEPS = D.steps;
  var N = STEPS.length;
  var VIEWS = D.groups.concat(D.episodes);

  function memberOf(view, mi) {
    if (!view) return null;
    return view.type === "group" ? view.members[Math.min(mi, view.members.length - 1)] : view;
  }

  /* Where step i sits against a finding: decisive, first seen, or spent on broken code. */
  function phaseOf(m, i) {
    var an = m && m.analysis;
    if (!an) return {};
    return {
      dec: i === an.t_err,
      obs: an.t_obs != null && i === an.t_obs,
      brk: i > an.t_err && (an.censored || (an.t_obs != null && i < an.t_obs)),
    };
  }

  function tokensText(n) {
    if (n < 1000) return String(n);
    if (n < 1e6) return (n / 1000).toFixed(n < 10000 ? 1 : 0).replace(/\.0$/, "") + "k";
    return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  }

  function tabLabel(v) {
    if (v.type === "episode") return "Fixed · " + v.label;
    return v.found ? "Step " + v.decisive + " · " + v.label : "Not bisectable · " + v.label;
  }
  function tabTone(v) {
    if (v.type === "episode") return "ok";
    return v.found ? "" : "warn";
  }

  function initialSel() {
    var m = /^#step-(\d+)$/.exec(location.hash || "");
    if (m && +m[1] >= 0 && +m[1] <= N) return +m[1];
    var v = VIEWS[0];
    if (v && v.decisive) return v.decisive;
    for (var i = 0; i < N; i++) if (STEPS[i].diff) return STEPS[i].i;
    for (var j = 0; j < N; j++) if (STEPS[j].mut) return STEPS[j].i;
    return N ? 1 : 0;
  }

  /* ---------------------------------------------------------------- header */

  function RunMeta() {
    var r = D.run;
    return html`<div class="runmeta">
      <h1>Run report</h1>
      <div class="chips">
        <span class="chip">run <code>${r.id}</code></span>
        ${r.repo ? html`<span class="chip">repo <code>${r.repo}</code></span>` : null}
        ${r.task ? html`<span class="chip">task <code>${r.task}</code></span>` : null}
        ${r.model ? html`<span class="chip">model <code>${r.model}</code></span>` : null}
        <span class="chip">recorded by <b>${r.source}</b></span>
        <span class="chip"><b>${r.n_steps}</b> steps (${r.n_mutating} change the repo)</span>
        <span class="chip" title=${r.tokens_exact}><b>${r.tokens}</b> tokens</span>
        ${r.cost ? html`<span class="chip">cost <b>${r.cost}</b></span>` : null}
        <span class="chip">${r.created}</span>
      </div>
    </div>`;
  }

  function Tabs(props) {
    var views = props.views;
    function onKey(e) {
      var k = e.key;
      if (k !== "ArrowRight" && k !== "ArrowLeft" && k !== "Home" && k !== "End") return;
      var i = props.tab;
      if (k === "ArrowRight") i = (i + 1) % views.length;
      else if (k === "ArrowLeft") i = (i - 1 + views.length) % views.length;
      else if (k === "Home") i = 0;
      else i = views.length - 1;
      e.preventDefault();
      props.onTab(i);
      setTimeout(function () {
        var el = document.getElementById("tab-" + i);
        if (el) el.focus();
      }, 0);
    }
    return html`<div class="tabs" role="tablist" aria-label="Findings in this run" onKeyDown=${onKey}>
      ${views.map(function (v, i) {
        return html`<button type="button" role="tab" id=${"tab-" + i} key=${v.id} class="tab"
          aria-selected=${i === props.tab} aria-controls="panel" tabindex=${i === props.tab ? 0 : -1}
          onClick=${function () { props.onTab(i); }}>
          <span class=${cx("dot", tabTone(v))}></span><span class="t">${tabLabel(v)}</span>
        </button>`;
      })}
    </div>`;
  }

  /* ---------------------------------------------------------------- hero */

  function Headline(props) {
    var text = props.text || "";
    var m = /^(Step \d+)([\s\S]*)$/.exec(text);
    if (!m) return html`<h2 class="headline">${text}</h2>`;
    return html`<h2 class="headline"><span class="stepno">${m[1]}</span>${m[2]}</h2>`;
  }

  function Stat(props) {
    var s = props.s;
    return html`<div class="stat">
      <div class="k">${s.k}</div>
      <div class="v" title=${s.title || null}>${s.v}${s.small ? html`<small>${s.small}</small>` : null}</div>
      ${s.bar != null ? html`<div class="bar" aria-hidden="true"><i style=${{ width: Math.min(100, s.bar) + "%" }}></i></div>` : null}
    </div>`;
  }

  /* Bar from step 0 to the last step: where the break was, where the agent saw it, what it cost. */
  function LagPanel(props) {
    var an = props.m.analysis;
    if (!an) return null;
    var pct = function (j) { return (N ? (j / N) * 100 : 0) + "%"; };
    var censored = an.censored;
    var endAt = censored ? N : an.t_obs;
    var last = censored && an.after === 0;
    var maxTok = 1;
    STEPS.forEach(function (s) { if (s.tokens > maxTok) maxTok = s.tokens; });

    var headline;
    if (last) headline = "Last step: the agent had no chance to see the failure";
    else if (censored) headline = "Never noticed: " + A.plural(an.after, "step") + " on broken code and counting";
    else if (an.lag === 0) headline = "Noticed at once, at step " + an.t_obs;
    else headline = A.plural(an.lag, "step") + " on broken code before the agent noticed";

    return html`<div class="lag" role="group" aria-label="Detection lag">
      <h3>Detection lag</h3>
      <div class="lagtrack" role="img" aria-label=${headline}>
        <div class="seg broken" style=${{ left: pct(an.t_err), width: "calc(" + pct(endAt) + " - " + pct(an.t_err) + ")" }}></div>
        ${!censored ? html`<div class="seg after" style=${{ left: pct(endAt), right: 0 }}></div>` : null}
        <div class="mk err" style=${{ left: pct(an.t_err) }}></div>
        ${!censored ? html`<div class="mk obs" style=${{ left: pct(an.t_obs) }}></div>` : null}
        ${censored && !last ? html`<span class="arrow"><${A.Icon} name="arrow" size=${22} /></span>` : null}
      </div>
      <div class="lagkey">
        <span><i style=${{ background: "var(--red-solid)" }}></i>Step ${an.t_err} broke it</span>
        ${!censored ? html`<span><i style=${{ background: "var(--blue)" }}></i>Step ${an.t_obs} the agent saw the failure</span>` : null}
        ${!last ? html`<span><i style=${{ background: "var(--amber)" }}></i>${headline}</span>` : html`<span>${headline}</span>`}
        ${an.wasted != null && an.wasted_fmt && !last
          ? html`<span class="muted">${an.wasted_fmt} tokens${an.share_fmt ? " (" + an.share_fmt + " of the run)" : ""} spent after the break</span>`
          : null}
      </div>
      <div class="lagtok" role="group" aria-label="Tokens per step">
        ${STEPS.map(function (s) {
          var ph = phaseOf(props.m, s.i);
          var cls = ph.dec ? "err" : ph.obs ? "obs" : ph.brk ? "broken" : s.i < an.t_err ? "pre" : "post";
          var h = Math.max(4, Math.round((s.tokens / maxTok) * 100));
          return html`<button type="button" key=${s.i} class=${cls} style=${{ height: h + "%" }}
            title=${"Step " + s.i + ": " + tokensText(s.tokens) + " tokens"}
            aria-label=${"Step " + s.i + ", " + tokensText(s.tokens) + " tokens"}
            onClick=${function () { props.onSelect(s.i, true); }}></button>`;
        })}
      </div>
      <div class="lagcap"><span>Tokens per step. Amber bars are steps spent on broken code.</span><span>step 1 to ${N}</span></div>
    </div>`;
  }

  function Hero(props) {
    var v = props.view;
    var m = props.m;
    var tone = v.type === "episode" ? "ok" : v.found ? "" : "warn";
    var eyebrow = v.type === "episode" ? "Caught and fixed" : v.found ? "Culprit found" : "Not bisectable";
    var sentences = v.sentences || [];
    var multi = v.type === "group" && v.members.length > 1;
    var picker = multi && !(v.shared && v.same_probes);
    return html`<section class=${cx("card", "hero", tone)} aria-label="Verdict">
      <div class="eyebrow"><${A.Icon} name=${v.found ? "check" : "warn"} size=${15} /> ${eyebrow}</div>
      ${v.found && sentences.length
        ? html`<${Headline} text=${sentences[0]} />
            <div class="subs">${sentences.slice(1).map(function (s) { return html`<p>${s}</p>`; })}</div>`
        : html`<h2 class="headline">${v.type === "episode" ? sentences[0] : "Not bisectable: " + v.label}</h2>
            <div class="subs">
              ${v.type === "episode"
                ? sentences.slice(1).map(function (s) { return html`<p>${s}</p>`; })
                : html`<p>${m.reason || "No reason recorded."}</p>`}
            </div>`}
      ${m.stats && m.stats.length && (!multi || v.shared || picker)
        ? html`<div class="stats">${m.stats.map(function (s) { return html`<${Stat} s=${s} key=${s.k} />`; })}</div>`
        : v.found && multi
          ? html`<div class="stats"><${Stat} s=${{ k: "Decisive step", v: String(v.decisive) }} /></div>`
          : null}
      ${m.analysis && m.analysis.signal
        ? html`<p class="note">Failure signal the agent saw: <code>${m.analysis.signal}</code></p>`
        : null}
      ${m.ground_truth
        ? html`<p class=${cx("note", "truth", m.ground_truth_ok ? "ok" : "bad")}>Ground truth: ${m.ground_truth}
            ${m.ground_truth_ok ? " Bisect found the same step." : " Bisect found a different step."}</p>`
        : null}
      ${(v.type === "group" ? v.members : []).filter(function (x) { return x.non_monotone; }).map(function (x) {
        return html`<p class="note alert">${multi ? x.label + ": " : ""}Non-monotone history: the check flipped between pass and fail.
          Pass to fail at steps ${x.transitions.join(", ")}. The decisive step is the last one, because the final state still carries that break.</p>`;
      })}
      ${v.type === "episode" && !v.found
        ? html`<p class="note">Step that broke it not found: ${v.reason || "No reason recorded."}</p>`
        : null}
      ${multi
        ? html`<div class="members">
            ${picker
              ? html`<label class="small muted">Show the replay and lag for
                  <select aria-label="Test to show" value=${props.mi} onChange=${function (e) { props.onMember(+e.target.value); }}>
                    ${v.members.map(function (x, k) { return html`<option value=${k}>${x.label}</option>`; })}
                  </select></label>`
              : null}
            <details>
              <summary class="small muted">Checks (${v.members.length})</summary>
              <ul>${v.members.map(function (x) { return html`<li><code>${x.check}</code></li>`; })}</ul>
            </details>
          </div>`
        : html`<p class="note">Check: <code>${v.check || m.check}</code></p>`}
      ${v.decisive
        ? html`<div class="heroactions">
            <button type="button" class="btn primary" onClick=${function () { props.onSelect(v.decisive, true); }}>
              Inspect step ${v.decisive} <${A.Icon} name="arrow" size=${15} />
            </button>
          </div>`
        : null}
      ${v.found ? html`<${LagPanel} m=${m} onSelect=${props.onSelect} />` : null}
    </section>`;
  }

  /* ---------------------------------------------------------------- replay */

  var VERDICT_ICON = { pass: "check", fail: "cross", error: "warn" };

  /* Arrow keys, Home and End move the selected step along the strip. */
  function stripKey(e, j, onSelect) {
    var to = null;
    if (e.key === "ArrowRight") to = Math.min(j + 1, N);
    else if (e.key === "ArrowLeft") to = Math.max(j - 1, 0);
    else if (e.key === "Home") to = 0;
    else if (e.key === "End") to = N;
    if (to === null) return;
    e.preventDefault();
    onSelect(to, false);
    setTimeout(function () {
      var el = document.getElementById("cell-" + to);
      if (el) el.focus();
    }, 0);
  }

  /* The step strip alone, for a run with nothing to replay. */
  function PlainStrip(props) {
    var cells = [];
    for (var j = 0; j <= N; j++) cells.push(j);
    return html`<section class="card replay" aria-label="Steps">
      <div class="rp-head"><div>
        <h2>The run, step by step</h2>
        <p class="rp-sub">Every step the agent took. Click one to see what it did, said and changed.</p>
      </div></div>
      <div class="legend" aria-hidden="true">
        <span><i></i>changes the repo</span><span><i class="l-ro"></i>read only</span>
        ${D.run.sabotage_step != null ? html`<span><i class="l-sab"></i>planted break</span>` : null}
      </div>
      <div class="strip" role="group" aria-label="Steps of the run. Use the left and right arrow keys to move between steps.">
        ${cells.map(function (j) {
          var s = j === 0 ? null : STEPS[j - 1];
          var cls = cx("cell", j === 0 || s.mut ? "mut" : "ro", props.sel === j && "sel", D.run.sabotage_step === j && "sabotage",
            props.matches && j > 0 && !props.matches[j] && "dim");
          return html`<button type="button" key=${j} id=${"cell-" + j} class=${cls} tabindex=${props.sel === j ? 0 : -1}
            aria-pressed=${props.sel === j} aria-label=${j === 0 ? "Step 0: the repo before the agent started" : "Step " + j + ": " + s.label}
            title=${j === 0 ? "Step 0: the repo before the agent started" : "Step " + j + ": " + s.label}
            onClick=${function () { props.onSelect(j, true); }} onKeyDown=${function (e) { stripKey(e, j, props.onSelect); }}>
            <${A.Glyph} kind=${j === 0 ? "base" : s.kind} size=${15} />
            <span class="ix">${j}</span>
          </button>`;
        })}
      </div>
    </section>`;
  }

  function Replay(props) {
    var m = props.m;
    var rp = m.replay;
    var frames = rp.frames;
    var F = frames.length;
    var E = rp.window_end;
    var posS = useState(0);
    var pos = posS[0];
    var setPos = posS[1];
    var playS = useState(false);
    var playing = playS[0];
    var setPlaying = playS[1];
    var spS = useState(1);
    var speed = spS[0];
    var setSpeed = spS[1];
    var landed = F > 0 && pos >= F;
    var cur = pos > 0 && pos <= F ? frames[pos - 1] : null;

    useEffect(
      function () {
        if (!playing) return undefined;
        if (pos >= F) {
          setPlaying(false);
          return undefined;
        }
        var t = setTimeout(function () {
          setPos(function (p) { return Math.min(p + 1, F); });
        }, (pos === 0 ? 450 : 1150) / speed);
        return function () { clearTimeout(t); };
      },
      [playing, pos, speed]
    );

    useEffect(
      function () {
        if (landed && m.found) props.onSelect(m.decisive, false);
      },
      [landed]
    );

    function play() {
      if (F === 0) return;
      if (A.reducedMotion()) {
        setPlaying(false);
        setPos(F);
        return;
      }
      if (playing) {
        setPlaying(false);
        return;
      }
      if (pos >= F) setPos(0);
      setPlaying(true);
    }
    function next() {
      setPlaying(false);
      setPos(function (p) { return Math.min(p + 1, F); });
    }
    function prev() {
      setPlaying(false);
      setPos(function (p) { return Math.max(p - 1, 0); });
    }
    function reset() {
      setPlaying(false);
      setPos(0);
    }
    var api = useRef();
    api.current = { play: play, next: next, prev: prev, reset: reset };
    useEffect(function () {
      function onKey(e) {
        if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
        var t = e.target;
        if (A.isTyping(t)) return;
        var inCtl = t && t.closest && t.closest(".rp-keys");
        var onBody = !t || t === document.body || t === document.documentElement || !t.closest;
        if (!(onBody || inCtl)) return;
        var k = e.key;
        if (k === " " || k === "Spacebar") {
          if (t && t.tagName === "BUTTON") return;
          e.preventDefault();
          api.current.play();
        } else if (k === "ArrowRight") {
          e.preventDefault();
          api.current.next();
        } else if (k === "ArrowLeft") {
          e.preventDefault();
          api.current.prev();
        } else if (k === "Home") {
          e.preventDefault();
          api.current.reset();
        }
      }
      document.addEventListener("keydown", onKey);
      return function () { document.removeEventListener("keydown", onKey); };
    }, []);

    /* the interval that is still unknown */
    var shade = rp.mono && F > 0;
    var lo = -1;
    var hi = E + 1;
    if (pos > 0 && shade) {
      if (landed && m.found) {
        lo = m.decisive - 1;
        hi = m.decisive;
      } else if (cur) {
        lo = cur.lo;
        hi = cur.hi;
      }
    }
    var probed = {};
    for (var k = 0; k < pos && k < F; k++) probed[frames[k].step] = frames[k];

    function cellClass(j) {
      var ph = landed ? phaseOf(m, j) : {};
      var step = j === 0 ? null : STEPS[j - 1];
      var c = ["cell", j === 0 || step.mut ? "mut" : "ro"];
      if (j > E) c.push("outside");
      else if (shade && pos > 0) {
        if (j <= lo) c.push("good");
        else if (j >= hi) c.push("bad");
      }
      if (cur && cur.step === j && !landed) c.push("cur");
      if (ph.dec) c.push("decisive");
      if (ph.obs) c.push("observed");
      if (ph.brk) c.push("broken");
      if (D.run.sabotage_step === j) c.push("sabotage");
      if (props.sel === j) c.push("sel");
      if (props.matches && j > 0 && !props.matches[j]) c.push("dim");
      return c.join(" ");
    }
    function cellLabel(j) {
      var s = j === 0 ? "Step 0: the repo before the agent started" : "Step " + j + ": " + STEPS[j - 1].label;
      var pr = probed[j];
      if (pr) s += ". Probe " + pr.n + " " + pr.verdict;
      var ph = landed ? phaseOf(m, j) : {};
      if (ph.dec) s += ". Decisive step";
      if (ph.obs) s += ". The agent first sees the failure";
      return s;
    }
    function cellKey(e, j) {
      stripKey(e, j, props.onSelect);
    }

    var cells = [];
    for (var j = 0; j <= N; j++) cells.push(j);

    /* status text */
    var badge = "READY";
    var bcls = "";
    var msg;
    var sub = "";
    if (F === 0) {
      badge = "NONE";
      msg = "No probes were run.";
      sub = m.reason || "";
    } else if (pos === 0) {
      msg = "Replay the search";
      sub = A.plural(E, "step") + " to search. Press Play, or Step to go one probe at a time.";
    } else if (!landed) {
      badge = cur.verdict.toUpperCase();
      bcls = cur.verdict;
      msg = "Probe " + cur.n + " of " + F + ": restore step " + cur.step + " and run the check";
      sub = (cur.runs != null ? A.plural(cur.runs, "run") + ", " + cur.fails + " failed. " : "");
      if (shade) {
        if (lo >= 0 && hi <= E) sub += "The first failing step is among steps " + (lo + 1) + " to " + hi + ".";
        else if (lo >= 0) sub += "The first failing step comes after step " + lo + ".";
        else if (hi <= E) sub += "The first failing step is at step " + hi + " or before.";
      } else {
        sub += "The history is not monotone, so every step is tested in order.";
      }
    } else if (m.found) {
      badge = "FOUND";
      bcls = "found";
      msg = "Found step " + m.decisive + " in " + A.plural(F, "probe") + (m.confidence ? ", confidence " + m.confidence : "");
      sub = m.decisive >= 1 && STEPS[m.decisive - 1] ? STEPS[m.decisive - 1].label : "";
      if (rp.reconstructed) sub += " (reconstructed, not re-run)";
    } else {
      badge = "STOPPED";
      bcls = "error";
      msg = "The bisect could not name a step";
      sub = m.reason || "";
    }

    var total = E + 1;
    var g = shade && pos > 0 ? A.clamp(lo + 1, 0, total) : 0;
    var b = shade && pos > 0 ? A.clamp(E + 1 - hi, 0, total) : 0;
    var u = total - g - b;
    var seg = function (cls, n) { return html`<div class=${"seg " + cls} style=${{ width: (total ? (n / total) * 100 : 0) + "%" }}></div>`; };

    var goodTxt = lo >= 0 ? "step " + lo : "not known yet";
    var badTxt = hi <= E ? "step " + hi : "not known yet";

    return html`<section class="card replay" aria-label="Bisect replay">
      <div class="rp-head">
        <div>
          <h2>Bisect replay ${rp.reconstructed ? html`<span class="badge-recon">reconstructed</span>` : null}</h2>
          <p class="rp-sub">${rp.reconstructed
            ? "The probe log of a repaired break is not stored. These are the probes a binary search over steps 0 to " + E + " makes when the answer is step " + m.decisive + ". Nothing was re-run."
            : "Binary search over the agent's steps. Each probe restores one snapshot and runs the check."}</p>
        </div>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i class="l-good"></i>known good</span><span><i class="l-bad"></i>known bad</span>
        <span><i class="l-unk"></i>still unknown</span><span><i></i>changes the repo</span><span><i class="l-ro"></i>read only</span>
        <span><i class="l-dec"></i>decisive step</span><span><i class="l-brk"></i>agent working on broken code</span>
        <span><i class="l-obs"></i>agent sees the failure</span>
        ${D.run.sabotage_step != null ? html`<span><i class="l-sab"></i>planted break</span>` : null}
      </div>
      <div class="strip" role="group" aria-label="Steps of the run. Use the left and right arrow keys to move between steps.">
        ${cells.map(function (j) {
          var pr = probed[j];
          var s = j === 0 ? null : STEPS[j - 1];
          return html`<button type="button" key=${j} id=${"cell-" + j} class=${cellClass(j)} tabindex=${props.sel === j ? 0 : -1}
            aria-label=${cellLabel(j)} aria-pressed=${props.sel === j} title=${j === 0 ? "Step 0: the repo before the agent started" : "Step " + j + ": " + s.label}
            onClick=${function () { props.onSelect(j, true); }} onKeyDown=${function (e) { cellKey(e, j); }}>
            ${pr ? html`<span class=${"mark " + pr.verdict}><${A.Icon} name=${VERDICT_ICON[pr.verdict] || "other"} size=${11} /></span>` : null}
            <${A.Glyph} kind=${j === 0 ? "base" : s.kind} size=${15} />
            <span class="ix">${j}</span>
          </button>`;
        })}
      </div>
      <div class="rail">
        <div class="track" role="img" aria-label=${"Interval: last good " + goodTxt + ", first bad " + badTxt}>
          ${seg("good", g)}${seg(shade && pos > 0 ? "unk" : "none", shade && pos > 0 ? u : total)}${seg("bad", b)}
        </div>
        <div class="railcap">
          <span>Last good: <b>${goodTxt}</b></span>
          ${landed && m.found ? html`<span>Culprit: <b>step ${m.decisive}</b></span>` : html`<span>${F ? "Probe " + pos + " of " + F : ""}</span>`}
          <span>First bad: <b>${badTxt}</b></span>
        </div>
      </div>
      <div class="rp-keys">
        <div class="rp-status" role="status" aria-live="polite">
          <div class=${"vbadge " + bcls}>${badge}</div>
          <div><div class="msg">${msg}</div><div class="msg2">${sub}</div></div>
        </div>
        <div class="controls">
          <button type="button" class="btn primary" onClick=${play} disabled=${F === 0} aria-label=${playing ? "Pause the replay" : "Play the replay"}>
            <${A.Icon} name=${playing ? "pause" : "play"} size=${14} /> ${playing ? "Pause" : landed ? "Replay" : "Play"}
          </button>
          <button type="button" class="btn" onClick=${prev} disabled=${pos === 0} aria-label="Previous probe"><${A.Icon} name="back" size=${14} /> Back</button>
          <button type="button" class="btn" onClick=${next} disabled=${landed || F === 0} aria-label="Next probe">Step <${A.Icon} name="step" size=${14} /></button>
          <button type="button" class="btn ghost" onClick=${reset} disabled=${pos === 0} aria-label="Reset the replay"><${A.Icon} name="reset" size=${14} /> Reset</button>
          <div class="grow">
            <input type="range" min="0" max=${F} value=${pos} aria-label="Probe position" disabled=${F === 0}
              onInput=${function (e) { setPlaying(false); setPos(+e.target.value); }} />
          </div>
          <div class="seg-btns" role="group" aria-label="Replay speed">
            ${[0.5, 1, 2, 4].map(function (s) {
              return html`<button type="button" key=${s} aria-pressed=${speed === s} onClick=${function () { setSpeed(s); }}>${s}×</button>`;
            })}
          </div>
        </div>
        <p class="hint"><kbd>Space</kbd> play or pause · <kbd>←</kbd> <kbd>→</kbd> step through the probes · <kbd>Home</kbd> reset.
          Click a step above (then use the arrow keys) to inspect it.</p>
      </div>
    </section>`;
  }

  /* ---------------------------------------------------------------- explorer */

  function Tags(props) {
    var ph = props.ph;
    var s = props.s;
    var v = props.view;
    return html`<span class="tags">
      ${ph.dec ? html`<span class="tag dec">${v && v.type === "episode" ? "BROKE IT" : "DECISIVE"}</span>` : null}
      ${ph.obs ? html`<span class="tag obs">AGENT SEES FAILURE</span>` : null}
      ${ph.brk && !ph.obs ? html`<span class="tag brk">ON BROKEN CODE</span>` : null}
      ${D.run.sabotage_step === s.i ? html`<span class="tag sab">PLANTED BREAK</span>` : null}
      ${props.probe ? html`<span class="tag prb">probe ${props.probe}</span>` : null}
      <span class="tiny muted">${tokensText(s.tokens)} tok${s.exit != null && s.exit !== 0 ? " · exit " + s.exit : ""}</span>
    </span>`;
  }

  function StepList(props) {
    var rows = props.rows;
    function onKey(e, idx) {
      var to = -1;
      if (e.key === "ArrowDown") to = Math.min(idx + 1, rows.length - 1);
      else if (e.key === "ArrowUp") to = Math.max(idx - 1, 0);
      else if (e.key === "Home") to = 0;
      else if (e.key === "End") to = rows.length - 1;
      else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        props.onSelect(rows[idx].i, true);
        return;
      }
      if (to < 0) return;
      e.preventDefault();
      props.onSelect(rows[to].i, false);
      setTimeout(function () {
        var el = document.getElementById("row-" + rows[to].i);
        if (el) el.focus();
      }, 0);
    }
    if (!rows.length) return html`<div class="empty">No step matches.</div>`;
    var selInList = rows.some(function (r) { return r.i === props.sel; });
    return html`<ul class="steplist" role="listbox" aria-label="Steps" data-keys="steps">
      ${rows.map(function (s, idx) {
        var ph = phaseOf(props.m, s.i);
        return html`<li key=${s.i} id=${"row-" + s.i} role="option" aria-selected=${props.sel === s.i}
          tabindex=${props.sel === s.i || (!selInList && idx === 0) ? 0 : -1}
          class=${cx("srow", s.mut ? "mut" : "ro", ph.dec && "is-dec", ph.obs && "is-obs", ph.brk && !ph.obs && "is-brk")}
          onClick=${function () { props.onSelect(s.i, true); }} onKeyDown=${function (e) { onKey(e, idx); }}>
          <span class="n">${s.i}</span>
          <span class="g"><${A.Glyph} kind=${s.kind} size=${15} /></span>
          <span>
            <span class="lbl">${s.label}</span>
            <${Tags} s=${s} ph=${ph} probe=${props.probeAt[s.i]} view=${props.view} />
          </span>
        </li>`;
      })}
    </ul>`;
  }

  function Ribbon(props) {
    var ph = props.ph;
    var ep = props.view && props.view.type === "episode";
    if (ph.dec)
      return html`<div class=${"ribbon " + (ep ? "fix" : "dec")}>${ep
        ? "This step broke the test. The agent fixed it later."
        : "Decisive step: the first step after which the check fails."}</div>`;
    if (ph.obs)
      return html`<div class="ribbon obs">The agent first sees the failure here.</div>`;
    if (ph.brk)
      return html`<div class="ribbon brk">The check already fails. The agent is working on broken code.</div>`;
    return null;
  }

  function Inspector(props) {
    var i = props.sel;
    var s = i >= 1 ? STEPS[i - 1] : null;
    var ph = phaseOf(props.m, i);
    var head = useRef(null);
    var argsOpen = useState(false);
    useEffect(
      function () {
        if (props.revealTick && head.current && head.current.scrollIntoView)
          head.current.scrollIntoView({ block: "nearest", behavior: A.reducedMotion() ? "auto" : "smooth" });
      },
      [props.revealTick]
    );
    if (i < 0 || (i > N)) return html`<div class="card inspector"><div class="empty">Select a step.</div></div>`;
    var go = function (d) {
      return function () { props.onSelect(A.clamp(i + d, 0, N), false); };
    };
    if (!s)
      return html`<div class="card inspector" aria-label="Step inspector">
        <div class="ins-head" ref=${head} tabindex="-1">
          <div class="ins-title"><span class="num">Step 0</span><h3>The repo before the agent did anything</h3></div>
          <div class="ins-nav"><button type="button" class="btn" disabled=${N === 0} onClick=${go(1)}>Next step</button></div>
        </div>
        <div class="ins-body"><p class="dmsg">This is the base snapshot. Every later snapshot is compared with the one before it.</p></div>
      </div>`;
    var diffBlock = null;
    if (s.mut) {
      var inner;
      if (s.diff_skipped) inner = html`<p class="dmsg">Diff left out to keep this page small.</p>`;
      else if (!s.diff) inner = html`<p class="dmsg">No file changes in this step's snapshot, or the shadow repo is not available.</p>`;
      else inner = html`<${A.DiffView} text=${s.diff} label=${"Diff of step " + s.i} />
          ${s.diff_truncated ? html`<p class="note">Diff clipped to the first lines.</p>` : null}`;
      diffBlock = html`<div class="cap"><span>Changes in this step</span></div>${inner}`;
    }
    return html`<div class="card inspector" aria-label="Step inspector">
      <div class="ins-head" ref=${head} tabindex="-1">
        <div class="ins-title">
          <span class="num">Step ${s.i}</span>
          <h3>${s.label}</h3>
        </div>
        <div class="ins-meta">
          <span>tool <b>${s.tool}</b></span>
          <span>${s.mut ? "changes the repo" : "read only"}</span>
          <span><b>${s.tokens.toLocaleString("en-US")}</b> tokens</span>
          ${s.exit != null ? html`<span>exit <b>${s.exit}</b></span>` : null}
          ${s.snap ? html`<span>snapshot <code>${s.snap}</code></span>` : null}
        </div>
        <div class="ins-nav">
          <button type="button" class="btn" disabled=${i <= 0} onClick=${go(-1)} aria-label="Previous step"><${A.Icon} name="back" size=${14} /> Previous</button>
          <button type="button" class="btn" disabled=${i >= N} onClick=${go(1)} aria-label="Next step">Next <${A.Icon} name="step" size=${14} /></button>
        </div>
      </div>
      <div class="ins-body">
        <${Ribbon} ph=${ph} view=${props.view} />
        ${s.why
          ? html`<div class="cap"><span>What the agent said before this step</span></div><div class="reasoning">${s.why}</div>`
          : null}
        ${diffBlock}
        ${s.out
          ? html`<div class="cap"><span>Output the agent saw</span></div><${A.CodeBlock} text=${s.out} label="Tool output" />`
          : null}
        ${s.args.length
          ? html`<div class="cap"><span>Arguments</span>
              <button type="button" class="btn ghost small" aria-expanded=${argsOpen[0]} onClick=${function () { argsOpen[1](!argsOpen[0]); }}>
                ${argsOpen[0] ? "Hide" : "Show"}</button></div>
            ${argsOpen[0]
              ? s.args.map(function (p) {
                  return html`<div class="argrow"><div class="argname mono">${p[0]}</div><${A.CodeBlock} text=${p[1]} label=${"Argument " + p[0]} /></div>`;
                })
              : html`<p class="small muted mono" style=${{ overflowWrap: "anywhere" }}>${s.args.map(function (p) { return p[0]; }).join(", ")}</p>`}`
          : null}
        ${s.clipped ? html`<p class="note">Long fields were clipped.</p>` : null}
      </div>
    </div>`;
  }

  function Explorer(props) {
    var qS = useState("");
    var q = qS[0];
    var oS = useState(false);
    var onlyMut = oS[0];
    var hay = useMemo(function () {
      return STEPS.map(function (s) {
        return (s.label + "\n" + (s.why || "") + "\n" + s.args.map(function (p) { return p[0] + " " + p[1]; }).join("\n") + "\n" + (s.out || "")).toLowerCase();
      });
    }, []);
    var ql = q.trim().toLowerCase();
    var rows = STEPS.filter(function (s, k) {
      if (onlyMut && !s.mut) return false;
      return !ql || hay[k].indexOf(ql) !== -1;
    });
    useEffect(function () { props.onMatches(ql ? rows : null); }, [ql, onlyMut]);
    var probeAt = {};
    (props.m && props.m.probes ? props.m.probes : []).forEach(function (p) {
      if (probeAt[p.step] === undefined) probeAt[p.step] = "#" + p.n + " " + p.verdict;
    });
    return html`<div class="explorer">
      <div class="card listcard">
        <div class="listtools">
          <label class="searchbox"><${A.Icon} name="search" size=${16} />
            <input type="search" placeholder="Search steps, output, reasoning" aria-label="Search steps" value=${q}
              onInput=${function (e) { qS[1](e.target.value); }} />
          </label>
          <label class="check"><input type="checkbox" checked=${onlyMut} onChange=${function (e) { oS[1](e.target.checked); }} />
            Only steps that changed the repo</label>
          <span class="count" role="status">Showing ${rows.length} of ${N} steps</span>
        </div>
        <${StepList} rows=${rows} sel=${props.sel} onSelect=${props.onSelect} m=${props.m} view=${props.view} probeAt=${probeAt} />
      </div>
      <${Inspector} sel=${props.sel} m=${props.m} view=${props.view} onSelect=${props.onSelect} revealTick=${props.revealTick} />
    </div>`;
  }

  /* ---------------------------------------------------------------- details */

  function ProbeTable(props) {
    var probes = props.probes;
    if (!probes.length) return html`<p class="note">No probes were run.</p>`;
    return html`<div class="tablewrap"><table>
      <thead><tr><th>#</th><th>step</th><th>role</th><th>verdict</th><th>runs</th><th>failed runs</th><th>seconds</th></tr></thead>
      <tbody>${probes.map(function (p) {
        return html`<tr key=${p.n}><td>${p.n}</td><td>${p.step}</td><td>${p.role}</td>
          <td><span class=${"pill " + p.verdict}>${p.verdict}</span></td><td>${p.runs}</td><td>${p.fails}</td><td>${p.seconds.toFixed(2)}</td></tr>`;
      })}</tbody>
    </table></div>`;
  }

  function Details(props) {
    var v = props.view;
    var m = props.m;
    var parts = [];
    if (v.type === "episode" && v.seen_output) {
      parts.push(html`<div class="card dcard" key="seen"><details open>
        <summary>What the agent saw at step ${v.seen_at} (last lines of output)</summary>
        <div class="dbody"><${A.CodeBlock} text=${v.seen_output} label="Output the agent saw" /></div></details></div>`);
    }
    if (m.oracle_tail) {
      parts.push(html`<div class="card dcard" key="tail"><details>
        <summary>Oracle output at step ${m.oracle_tail_step} (last lines)</summary>
        <div class="dbody"><${A.CodeBlock} text=${m.oracle_tail} label="Oracle output" /></div></details></div>`);
    }
    if (v.type === "group" && m.probes) {
      parts.push(html`<div class="card dcard" key="probes"><details>
        <summary>Probe log${v.members.length > 1 ? ": " + m.label : ""}</summary>
        <div class="dbody"><${ProbeTable} probes=${m.probes} />
          <p class="note">${v.found ? "Confidence " + (m.confidence || "not recorded") + " that step " + v.decisive + " is the decisive step. " : ""}${m.policy_rule ? "Oracle rule: " + m.policy_rule + " (assumed flip rate " + m.flake_rate + "). " : ""}${m.non_monotone ? "The history was non-monotone: the check flipped back and forth." : "No sign of a non-monotone history."}</p>
        </div></details></div>`);
    }
    if (v.explanation) {
      parts.push(html`<div class="card dcard aibox" key="ai"><div class="dbody" style=${{ paddingTop: "14px" }}>
        <div class="label">${v.explanation.label}</div>
        <p class="note">${v.explanation.note}</p>
        <p class="aitext">${v.explanation.text}</p></div></div>`);
    }
    if (!parts.length) return null;
    return html`<div class="dgrid">${parts}</div>`;
  }

  /* ---------------------------------------------------------------- app */

  function App() {
    var tabS = useState(0);
    var memS = useState(0);
    var selS = useState(initialSel);
    var tickS = useState(0);
    var matchS = useState(null);
    var tab = Math.min(tabS[0], Math.max(VIEWS.length - 1, 0));
    var view = VIEWS[tab] || null;
    var m = view ? memberOf(view, memS[0]) : null;
    var sel = selS[0];

    function select(i, reveal) {
      selS[1](i);
      try {
        history.replaceState(null, "", "#step-" + i);
      } catch (e) {}
      if (reveal) tickS[1](function (t) { return t + 1; });
    }
    useEffect(function () {
      function onHash() {
        var h = /^#step-(\d+)$/.exec(location.hash || "");
        if (h && +h[1] <= N) selS[1](+h[1]);
      }
      window.addEventListener("hashchange", onHash);
      return function () { window.removeEventListener("hashchange", onHash); };
    }, []);
    function onTab(i) {
      tabS[1](i);
      memS[1](0);
      var v = VIEWS[i];
      if (v && v.decisive) select(v.decisive, false);
    }
    function onMatches(rows) {
      if (!rows) {
        matchS[1](null);
        return;
      }
      var set = {};
      rows.forEach(function (s) { set[s.i] = true; });
      matchS[1](set);
    }

    var crumb = D.run.id;
    return html`<div>
      <${A.TopBar} kind="report" crumb=${crumb} />
      <main class="wrap page">
        <${RunMeta} />
        ${D.overview
          ? html`<div class=${"notice " + D.overview.kind} role="note" style=${{ marginTop: "14px" }}>
              <strong>${D.overview.title}</strong><div>${D.overview.text}</div></div>`
          : null}
        ${VIEWS.length > 1 ? html`<${Tabs} views=${VIEWS} tab=${tab} onTab=${onTab} />` : null}
        ${view
          ? html`<div id="panel" role=${VIEWS.length > 1 ? "tabpanel" : null} aria-labelledby=${VIEWS.length > 1 ? "tab-" + tab : null}>
              <div class="section"><${Hero} view=${view} m=${m} mi=${memS[0]} onMember=${function (k) { memS[1](k); }} onSelect=${select} /></div>
              ${m.replay && m.replay.frames && (view.found || m.replay.frames.length)
                ? html`<div class="section"><${Replay} key=${view.id + ":" + memS[0]} m=${m} sel=${sel} onSelect=${select} matches=${matchS[0]} /></div>`
                : null}
            </div>`
          : null}
        ${!view && N ? html`<div class="section"><${PlainStrip} sel=${sel} onSelect=${select} matches=${matchS[0]} /></div>` : null}
        <div class="section">
          <h2>Step explorer</h2>
          <${Explorer} sel=${sel} onSelect=${select} m=${m} view=${view} revealTick=${tickS[0]} onMatches=${onMatches} />
        </div>
        ${view ? html`<div class="section"><${Details} view=${view} m=${m} /></div>` : null}
        <p class="footer">The verdict comes from running your check on each snapshot. No language model decides pass or fail.<br />Made by AgentBisect.</p>
      </main>
    </div>`;
  }

  var root = document.getElementById("app");
  root.textContent = "";
  A.render(html`<${App} />`, root);
})();

</script>
</body>
</html>
